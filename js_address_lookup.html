function lookupThaiAddressByZip(zipcode) {
  if (!zipcode) return null;
  const z = String(zipcode).trim();
  return THAI_ZIPCODE_DB[z] || null;
}

function autoFillAddressFromZipcode(isModal = false) {
  const $zipInput = isModal ? $('#editPostalCode') : $('#inPaneEditPostalCode');
  const $provInput = isModal ? $('#editProvince') : $('#inPaneEditProvince');
  const $distInput = isModal ? $('#editDistrict') : $('#inPaneEditDistrict');
  const $subInput = isModal ? $('#editSubdistrict') : $('#inPaneEditSubdistrict');

  if ($zipInput.length === 0) return;
  const zip = $zipInput.val() ? $zipInput.val().trim() : '';
  if (zip.length === 5) {
    const match = lookupThaiAddressByZip(zip);
    if (match) {
      $provInput.val(match.p).trigger('change');
      $distInput.val(match.a).trigger('change');
      
      // อัปเดต datalist ของตำบลสำหรับรหัสไปรษณีย์นี้
      const datalistId = isModal ? 'modalSubdistrictsList' : 'thaiSubdistrictsList';
      let $tList = $('#' + datalistId);
      if ($tList.length === 0) {
        $tList = $('<datalist id="' + datalistId + '"></datalist>');
        $('body').append($tList);
        $subInput.attr('list', datalistId);
      }
      $tList.empty();
      if (match.t && match.t.length > 0) {
        match.t.forEach(function(tName) {
          $tList.append($('<option>', { value: tName }));
        });
        // หากช่องตำบลยังว่าง หรือผู้ใช้พิมพ์เปลี่ยนรหัสไปรษณีย์ใหม่ ให้เลือกตำบลแรกเป็นค่าเริ่มต้น
        const currentSub = $subInput.val() ? $subInput.val().trim() : '';
        if (!currentSub || !match.t.includes(currentSub)) {
          $subInput.val(match.t[0]).trigger('change');
        }
      }
      
      // แสดง Notification ขนาดกะทัดรัด (Toast)
      if (typeof Swal !== 'undefined') {
        const Toast = Swal.mixin({
          toast: true,
          position: 'top-end',
          showConfirmButton: false,
          timer: 2200,
          timerProgressBar: true
        });
        Toast.fire({
          icon: 'success',
          title: `ค้นพบที่อยู่: จ.${match.p} อ.${match.a}`
        });
      }
    }
  }
}

// ผูก Event ทันทีที่ผู้ใช้พิมพ์รหัสไปรษณีย์ครบ 5 ตัว หรือ paste หรือเปลี่ยน
$(document).on('input change blur keyup paste', '#inPaneEditPostalCode', function() {
  autoFillAddressFromZipcode(false);
});

$(document).on('input change blur keyup paste', '#editPostalCode', function() {
  autoFillAddressFromZipcode(true);
});
</script>
