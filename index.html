  <link rel="icon" type="image/png" href="https://lh5.googleusercontent.com/d/1tDVKF6qFEl7_avxewudlClYsk9qkrgop">

  <!-- Google Font: Sarabun -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f8fafc;
      font-family: 'Sarabun', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Preloader Layer */
    #preloader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #ffffff 0%, #f1f5f9 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }
    #preloader.loaded {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .logo-container {
      position: relative;
      margin-bottom: 24px;
    }
    .logo-img {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: contain;
      box-shadow: 0 10px 25px -5px rgba(68, 182, 223, 0.4);
      background: #ffffff;
      padding: 6px;
      position: relative;
      z-index: 2;
    }
    .logo-halo {
      position: absolute;
      top: -10px;
      left: -10px;
      right: -10px;
      bottom: -10px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(68, 182, 223, 0.3) 0%, rgba(68, 182, 223, 0) 70%);
      animation: pulse-halo 2.5s infinite ease-in-out;
      z-index: 1;
    }
    @keyframes pulse-halo {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.2); opacity: 0.2; }
    }
    .brand-title {
      font-size: 1.75rem;
      font-weight: 700;
      color: #1e3a8a;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    .brand-subtitle {
      font-size: 0.95rem;
      color: #475569;
      margin-bottom: 24px;
      font-weight: 400;
    }
    .spinner-ring {
      display: inline-block;
      width: 38px;
      height: 38px;
      border: 3px solid #e2e8f0;
      border-radius: 50%;
      border-top-color: #44b6df;
      animation: spin 0.8s linear infinite;
      margin-bottom: 14px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .status-text {
      font-size: 0.85rem;
      color: #94a3b8;
    }

    /* Fullscreen iFrame */
    #primisFrame {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      border: none;
      margin: 0;
      padding: 0;
      overflow: hidden;
      z-index: 1;
      display: block;
    }
  </style>
</head>
<body>

  <!-- Premium Preloader -->
  <div id="preloader">
    <div class="logo-container">
      <div class="logo-halo"></div>
      <img src="https://lh5.googleusercontent.com/d/1tDVKF6qFEl7_avxewudlClYsk9qkrgop" alt="BCNSPRNW Logo" class="logo-img">
    </div>
    <div class="brand-title">PRIMIS</div>
    <div class="brand-subtitle">ระบบสารสนเทศบุคลากรกลาง (BCNSPRNW)</div>
    <div class="spinner-ring"></div>
    <div class="status-text">กำลังเชื่อมต่อระบบ กรุณารอสักครู่...</div>
  </div>

  <!-- Google Apps Script Web App Fullscreen Frame -->
  <iframe 
    id="primisFrame" 
    src="https://script.google.com/macros/s/AKfycbyVh4LyyTHrTSvOnLyLWZOrsjBpC6Hy1F6NF0b8v7H6_jLuXvoda86P_NK5c_SncAtH/exec"
    allow="camera; microphone; geolocation; fullscreen; clipboard-read; clipboard-write"
    onload="hidePreloader()">
  </iframe>

  <script>
    function hidePreloader() {
      var loader = document.getElementById('preloader');
      if (loader && !loader.classList.contains('loaded')) {
        setTimeout(function() {
          loader.classList.add('loaded');
        }, 500);
      }
    }

    // Safety timeout: ซ่อน preloader ภายใน 3.5 วินาทีหาก iframe โหลดเสร็จก่อนแต่ event ช้า
    setTimeout(function() {
      hidePreloader();
    }, 3500);
  </script>

</body>
</html>
