<script>
/**
 * =========================================================================
 * Personnel Management Controller (js_projects.html)
 * จัดการตารางข้อมูลบุคลากร และฟังก์ชันการดู/แก้ไขประวัติ 33 คอลัมน์
 * =========================================================================
 */

let personnelDataTable = null;
window.masterPersonnelCache = [];

$(document).ready(function() {
  // พรีโหลดรายการคำนำหน้าชื่อระบบจากตาราง hr_prefixes
  loadPrefixDropdowns();
});

/**
 * โหลดรายชื่อบุคลากรทั้งหมด 120 ท่านเข้า Master Cache
 * @param {boolean} forceRefresh บังคับดึงข้อมูลใหม่จากเซิร์ฟเวอร์
 */
function loadPersonnelTable(forceRefresh) {
  if (!forceRefresh && window.masterPersonnelCache && window.masterPersonnelCache.length > 0) {
    applyPersonnelFilters();
    return;
  }

  showPpmsLoading('กำลังโหลดทะเบียนบุคลากร...', 'กำลังดึงข้อมูลจาก cit_mis_db');
  const safetyTimer = setTimeout(function() {
    hidePpmsLoading();
  }, 12000);

  google.script.run
    .withSuccessHandler(function(res) {
      clearTimeout(safetyTimer);
      hidePpmsLoading();
      if (res && res.status === 'success') {
        const rawList = res.data || [];
        const seen = {};
        const cleaned = rawList.filter(function(p) {
          const pin = String(p.pin || p.user_pin || p.id || '').trim();
          if (pin === '1' || pin === '999999' || p.id === 1 || p.id === 121 || p.id === '1' || p.id === '121') return false;
          const name = ((p.title_th || '') + (p.fname_th || p.master_fname || '') + (p.lname_th || p.master_lname || '')).toLowerCase();
          if (name.indexOf('ทดสอบ') !== -1 || name.indexOf('สแกนนิ้ว') !== -1 || name.indexOf('cit1') !== -1) return false;
          const key = String(p.user_pin || p.pin || p.id);
          if (seen[key]) return false;
          seen[key] = true;
          return true;
        });
        window.masterPersonnelCache = cleaned;
        window.allPersonnelList = cleaned;
        currentPersonnelList = cleaned;
        applyPersonnelFilters();

        // โหลดข้อมูลประวัติการศึกษาเพื่อเสริมวุฒิสูงสุดให้แสดงผลทันทีแบบ Real-time
        if (typeof google !== 'undefined' && google.script && google.script.run) {
          google.script.run
            .withSuccessHandler(function(eRes) {
              if (eRes && eRes.status === 'success' && Array.isArray(eRes.data)) {
                window.highestEducationMap = {};
                eRes.data.forEach(function(e) {
                  const sPin = String(e.staff_id || '');
                  if (!window.highestEducationMap[sPin] || e.is_highest == 1) {
                    window.highestEducationMap[sPin] = e;
                  }
                });
                let hasUpdate = false;
                if (window.masterPersonnelCache) {
                  window.masterPersonnelCache.forEach(function(p) {
                    const pin = String(p.pin || p.user_pin || p.id || '');
                    const ed = window.highestEducationMap[pin];
                    if (ed && (!p.highest_degree_short || p.highest_degree_short === '-')) {
                      p.highest_degree_short = ed.degree_short || ed.degree_name;
                      p.highest_degree = ed.degree_name;
                      p.highest_edu_level = ed.edu_level;
                      hasUpdate = true;
                    }
                  });
                }
                if (hasUpdate) {
                  applyPersonnelFilters();
                }
              }
            })
            .getEducationRecords('');
        }
      } else {
        window.masterPersonnelCache = [];
        renderPersonnelTable([]);
        Swal.fire('ข้อผิดพลาด', res ? res.message : 'ไม่สามารถโหลดข้อมูลบุคลากรได้', 'error');
      }
    })
    .withFailureHandler(function(err) {
      clearTimeout(safetyTimer);
      hidePpmsLoading();
      renderPersonnelTable([]);
      Swal.fire('การเชื่อมต่อขัดข้อง', err ? err.message : 'ไม่สามารถเชื่อมต่อได้', 'error');
    })
    .getPersonnelList('all', 'all', 'all');
}

/**
 * ตรวจสอบว่าเป็นบุคลากรสายสอน (อาจารย์ / ผู้บริหารสายสอน) หรือไม่ (Single Source of Truth)
 * ใช้ร่วมกันอย่างเป็นเอกภาพทั้งในระบบกรอง (Filter) และระบบวาดตาราง (Renderer)
 * @param {object} p ข้อมูลบุคลากร
 * @returns {boolean} true=สายสอน, false=สายสนับสนุน
 */
function isTeachingStaffMember(p) {
  if (!p) return false;
  const pin = String(p.pin || p.user_pin || p.id || '').trim();
  const posTitle = (p.position_title && p.position_title.trim() && p.position_title.trim() !== 'บุคลากร') 
    ? p.position_title 
    : (p.position || p.position_title || '');
  const posStr = String(posTitle || '') + ' ' + String(p.position || '');

  // 1. ตรวจสอบคำสำคัญสายสนับสนุนชัดเจน (ถ้ามีคำเหล่านี้ ถือเป็นสายสนับสนุนทันที)
  const nonTeachingKeywords = ['ห้องสมุด', 'เจ้าหน้าที่', 'แม่บ้าน', 'รปภ', 'สายสนับสนุน', 'ธุรการ', 'นักวิชาการ', 'พัสดุ', 'การเงิน', 'ช่าง', 'คนงาน', 'บรรณารักษ์', 'พนักงานขับรถ'];
  if (nonTeachingKeywords.some(kw => posStr.includes(kw))) {
    return false;
  }

  // 2. ถ้าในตาราง hr_personnel_profile ระบุ job_line ไว้ชัดเจน
  if (p.job_line === 'สายสอน') return true;
  if (p.job_line === 'สายสนับสนุน') return false;

  // 3. ตรวจสอบรหัส PIN ทางการ: รหัสขึ้นต้น 371 คือข้าราชการสายสอน/อาจารย์
  if (pin.startsWith('371')) return true;

  // 4. ตรวจสอบตำแหน่งสายสอนและผู้บริหารสายวิชาการ (อาจารย์, ผู้อำนวยการ, ศาสตราจารย์)
  if (posStr.includes('อาจารย์') || posStr.includes('ผู้อำนวยการ') || posStr.includes('ศาสตราจารย์')) {
    return true;
  }

  // 5. ตรวจสอบประเภทบุคลากร (position_type / user_type)
  const pType = String(p.position_type || p.user_type || p.master_user_type || '').toLowerCase();
  if (pType.includes('อาจารย์') || pType === 'teacher' || pType === 'academic') {
    return true;
  }

  return false;
}

/**
 * กรองข้อมูลบุคลากรบน Client-Side แบบ Real-time ทันที (0ms)
 */
function applyPersonnelFilters() {
  const jobLine = $('#filterJobLine').val() || 'all';
  const workStatus = $('#filterWorkStatus').val() || 'active';
  const baseList = window.masterPersonnelCache || window.allPersonnelList || currentPersonnelList || [];

  const filtered = baseList.filter(function(p) {
    // 1. กรองสายงาน (อาจารย์ vs สายสนับสนุน)
    if (jobLine !== 'all') {
      const isTeacher = isTeachingStaffMember(p);
      if (jobLine === 'สายสอน' && !isTeacher) return false;
      if (jobLine === 'สายสนับสนุน' && isTeacher) return false;
    }

    // 2. กรองสถานะการปฏิบัติงาน (ยึด hr_personnel_profile เป็นหลัก)
    const curStatus = String(p.work_status || 'ปกติ/ปฏิบัติงาน/ข้าราชการ/รับโอน').trim();
    if (workStatus === 'active') {
      // โหมดผู้ปฏิบัติงานปัจจุบัน (Active): ซ่อนผู้ที่ลาออก, เกษียณอายุ, เสียชีวิต และโอนย้ายออก
      if (
        curStatus === 'ลาออก' ||
        curStatus.includes('เกษียณ') ||
        curStatus === 'เสียชีวิต' ||
        curStatus.includes('โอนย้ายไปนอก') ||
        curStatus.includes('โอนย้ายไปใน') ||
        curStatus.includes('ให้โอนข้าราชการไปนอก') ||
        curStatus.includes('ย้ายข้าราชการออกไปนอก') ||
        curStatus.includes('ย้ายไปคณะแพทย์') ||
        curStatus.includes('พ้นสภาพ')
      ) {
        return false;
      }
    } else if (workStatus === 'all') {
      // แสดงทุกสถานะรวมผู้พ้นสภาพ: แสดงครบทั้งหมด 120 คน
      return true;
    } else if (workStatus === 'ลาออก') {
      if (curStatus !== 'ลาออก') return false;
    } else if (workStatus === 'เกษียณอายุ') {
      if (!curStatus.includes('เกษียณ')) return false;
    } else if (workStatus === 'ช่วยราชการ') {
      if (!curStatus.includes('ช่วยราชการ')) return false;
    } else if (workStatus === 'โอนย้ายไปใน สบช.') {
      if (!curStatus.includes('โอนย้ายไปใน สบช') && !curStatus.includes('ย้ายภายใน สบช')) return false;
    } else if (workStatus === 'โอนย้ายไปนอก สบช.') {
      if (
        !curStatus.includes('โอนย้ายไปนอก สบช') &&
        !curStatus.includes('ให้โอนข้าราชการไปนอก สบช') &&
        !curStatus.includes('ย้ายข้าราชการออกไปนอก สบช') &&
        !curStatus.includes('ย้ายไปคณะแพทย์')
      ) return false;
    } else if (workStatus === 'ปกติ/ปฏิบัติงาน/ข้าราชการ/รับโอน' || workStatus === 'กำลังปฏิบัติงาน') {
      if (curStatus !== 'ปกติ/ปฏิบัติงาน/ข้าราชการ/รับโอน' && curStatus !== 'กำลังปฏิบัติงาน') return false;
    } else {
      if (curStatus !== workStatus) return false;
    }

    return true;
  });

  renderPersonnelTable(filtered);
}

function renderPersonnelTable(data) {
  if ($.fn.DataTable.isDataTable('#personnelTable')) {
    $('#personnelTable').DataTable().destroy();
  }
  personnelDataTable = null;

  const $tbody = $('#personnelTableBody');
  $tbody.empty();

  if (!data || data.length === 0) {
    $tbody.html('<tr><td colspan="8" class="text-center py-4 text-muted">ไม่พบข้อมูลบุคลากรตามเงื่อนไขที่เลือก</td></tr>');
    return;
  }

  const curRole = (window.currentUserRole || 'guest').toLowerCase();
  const curPin = String(window.currentUserPin || '');
  const isAdmin = (curRole === 'super_admin' || curRole === 'hr_admin');
  const isExecutive = (curRole === 'executive');

  data.forEach(function(p) {
    const pin = String(p.pin || p.user_pin || p.id || '');
    const nameTh = (p.title_th || '') + (p.fname_th || p.master_fname || '') + ' ' + (p.lname_th || p.master_lname || '');
    const nameEn = (p.title_en || '') + ' ' + (p.fname_en || '') + ' ' + (p.lname_en || '');
    
    // ให้ความสำคัญสูงสุดกับตำแหน่งและประเภทบุคลากรจาก hr_personnel_profile
    const posTitle = (p.position_title && p.position_title.trim() && p.position_title.trim() !== 'บุคลากร') 
      ? p.position_title 
      : (p.position || p.position_title || 'บุคลากร');
    const posNo = p.position_number ? ('<span class="badge bg-light text-dark border me-1">' + p.position_number + '</span>') : '';
    // ตรวจสอบสายงานและความเป็นอาจารย์อย่างแม่นยำด้วยฟังก์ชันกลาง Single Source of Truth
    const isActuallyTeacher = isTeachingStaffMember(p);

    // Badge สายงาน
    const jobLineBadge = isActuallyTeacher 
      ? '<span class="badge rounded-pill px-2 py-1 fw-bold" style="background-color: #e0f2fe; color: #0369a1; border: 1px solid #7dd3fc;"><i class="fa-solid fa-chalkboard-user me-1"></i>สายสอน</span>' 
      : '<span class="badge rounded-pill px-2 py-1 fw-bold" style="background-color: #fef3c7; color: #b45309; border: 1px solid #fcd34d;"><i class="fa-solid fa-briefcase me-1"></i>สายสนับสนุน</span>';

    // คอลัมน์ประเภท: หากเป็น user / admin / staff / ค่าว่าง / - ให้แสดงเป็น "อาจารย์" หรือ "สายสนับสนุน"
    let displayPosType = (p.position_type && !['user', 'admin', 'staff', 'guest', '-'].includes(String(p.position_type).toLowerCase().trim())) 
      ? String(p.position_type).trim() 
      : (isActuallyTeacher ? 'อาจารย์' : 'สายสนับสนุน');

    // Status Pill พร้อม Icon และสีตามมาตรฐาน 8 กลุ่มสถานะ
    const curStatus = String(p.work_status || '').trim();
    const statusBadge = renderWorkStatusBadge(curStatus, true);

    // Highest Degree
    const eduFromMap = (window.highestEducationMap && (window.highestEducationMap[pin] || window.highestEducationMap[String(p.id)])) || null;
    const rawDeg = (p.highest_degree_short || p.highest_degree || p.highest_edu_level || (eduFromMap ? (eduFromMap.degree_short || eduFromMap.degree_name || eduFromMap.edu_level) : '') || '').trim();
    const highestDeg = (rawDeg && rawDeg !== '-') ? rawDeg : '-';
    const highestDegTitle = (p.highest_degree || (eduFromMap ? eduFromMap.degree_name : '') || highestDeg);
    const highestDegBadge = (highestDeg !== '-')
      ? '<span class="badge rounded-pill px-2 py-1 fw-semibold shadow-2xs" style="background-color: #ede9fe; color: #6d28d9; border: 1px solid #c4b5fd; font-size: 0.72rem;" title="' + highestDegTitle + '"><i class="fa-solid fa-graduation-cap me-1"></i>' + highestDeg + '</span>'
      : '<span class="text-muted" style="font-size: 0.75rem;">-</span>';

    const rawPhoto = p.photo_url || p.master_photo || '';
    const avatarUrl = (typeof formatStaffPhotoUrl === 'function' ? formatStaffPhotoUrl(rawPhoto) : '') || DEFAULT_STAFF_AVATAR;

    const cleanEn = (nameEn && nameEn.trim() && nameEn.trim() !== 'No English Name') ? nameEn.trim() : '';
    const nameEnHtml = cleanEn ? ('<div class="text-muted" style="font-size: 0.70rem; line-height: 1.1;">' + cleanEn + '</div>') : '';

    const isSelf = (String(pin) === curPin);
    let btns = '<div class="btn-group btn-group-sm text-nowrap shadow-2xs" role="group" style="white-space: nowrap;">' +
      '<button type="button" class="btn btn-outline-primary btn-sm px-2 py-1 text-nowrap" onclick="event.stopPropagation(); openPersonnelInPaneDetail(\'' + pin + '\')" title="ดูรายละเอียดประวัติแบบเต็มหน้าจอ" style="font-size: 0.76rem; white-space: nowrap;">' +
      '<i class="fa-solid fa-eye me-1"></i>ดูประวัติ</button>';

    if (isAdmin || isExecutive || isSelf) {
      btns += '<button type="button" class="btn btn-outline-success btn-sm px-2 py-1" onclick="event.stopPropagation(); openSalaryModal(\'' + pin + '\')" title="ดูประวัติเงินเดือน ก.พ.7" style="font-size: 0.76rem;">' +
        '<i class="fa-solid fa-money-bill-wave"></i></button>';
    }
    if (isAdmin) {
      btns += '<button type="button" class="btn btn-outline-warning btn-sm px-2 py-1" onclick="event.stopPropagation(); openPersonnelEditInPane(\'' + pin + '\')" title="แก้ไขประวัติและ ก.พ.7" style="font-size: 0.76rem;">' +
        '<i class="fa-solid fa-pen-to-square"></i></button>';
    }
    btns += '</div>';

    const branchText = p.academic_branch ? (' <span class="text-primary fw-medium">(' + p.academic_branch + ')</span>') : '';
    const deptInfo = [p.main_group, p.department].filter(Boolean).join(' » ') || '-';
    const adminPosHtml = p.admin_position ? ('<span class="badge bg-warning-subtle text-warning-emphasis border border-warning-subtle ms-1" style="font-size:0.68rem;"><i class="fa-solid fa-crown me-1 text-warning"></i>' + p.admin_position + '</span>') : '';

    const trHtml = '<tr>' +
      '<td class="text-center"><span class="badge bg-primary-subtle text-primary border rounded-pill px-2 py-0 fw-bold" style="font-size: 0.72rem;">#' + pin + '</span></td>' +
      '<td><div class="d-flex align-items-center gap-2">' +
      '<img src="' + avatarUrl + '" alt="' + nameTh + '" class="rounded-circle border cursor-pointer personnel-avatar-img" style="width: 32px; height: 32px; min-width: 32px; object-fit: cover; cursor: pointer;" onclick="openPersonnelInPaneDetail(\'' + pin + '\')" onerror="this.onerror=null;this.src=DEFAULT_STAFF_AVATAR">' +
      '<div class="min-w-0"><a href="javascript:void(0)" class="personnel-name-link fw-bold text-dark text-truncate d-block" onclick="openPersonnelInPaneDetail(\'' + pin + '\')" title="คลิกเพื่อดูรายละเอียดแบบเต็มหน้าจอ" style="font-size: 0.86rem; line-height: 1.25;">' + nameTh + '</a>' + nameEnHtml + '</div>' +
      '</div></td>' +
      '<td><div style="line-height: 1.2;">' + posNo + '<span class="fw-semibold text-secondary" style="font-size: 0.84rem;">' + posTitle + '</span>' + adminPosHtml + '</div>' +
      '<div class="text-muted" style="font-size: 0.70rem; line-height: 1.2; margin-top: 2px;">' + deptInfo + branchText + '</div></td>' +
      '<td class="mobile-hide-col"><span class="text-dark fw-semibold" style="font-size: 0.82rem;">' + displayPosType + '</span></td>' +
      '<td class="mobile-hide-col">' + jobLineBadge + '</td>' +
      '<td class="mobile-hide-col text-center">' + highestDegBadge + '</td>' +
      '<td class="mobile-hide-col">' + statusBadge + '</td>' +
      '<td class="text-center text-nowrap" style="width: 145px; min-width: 140px;">' + btns + '</td>' +
      '</tr>';

    $tbody.append(trHtml);
  });

  personnelDataTable = $('#personnelTable').DataTable({
    pageLength: 10,
    language: {
      search: "_INPUT_",
      searchPlaceholder: "ค้นหาในตาราง...",
      lengthMenu: "แสดง _MENU_ แถวต่อหน้า",
      info: "แสดง _START_ ถึง _END_ จากทั้งหมด _TOTAL_ รายการ",
      paginate: {
        previous: "ก่อนหน้า",
        next: "ถัดไป"
      }
    },
    responsive: true,
    destroy: true
  });
}

function filterPersonnelTableClient(keyword) {
  if (personnelDataTable) {
    personnelDataTable.search(keyword).draw();
  }
}

// -------------------------------------------------------------------------
// Helper: คำนวณวันเกษียณอายุราชการ 60 ปีบริบูรณ์ (30 กันยายน)
// -------------------------------------------------------------------------
function calculateRetirementDateTh(birthDateStr) {
  if (!birthDateStr) return '-';
  const d = new Date(birthDateStr);
  if (isNaN(d.getTime())) return '-';
  const birthYearBe = (d.getFullYear() > 2400) ? d.getFullYear() : (d.getFullYear() + 543);
  const birthMonth = d.getMonth() + 1; // 1-12
  const birthDay = d.getDate();

  // ข้าราชการไทย: สิ้นสุดวันที่ 30 กันยายน ของปีงบประมาณที่อายุครบ 60 ปี
  // หากเกิด 2 ต.ค. เป็นต้นไป จะไปเกษียณในวันที่ 30 ก.ย. ของปีถัดไป
  let retireYearBe = birthYearBe + 60;
  if (birthMonth > 10 || (birthMonth === 10 && birthDay >= 2)) {
    retireYearBe += 1;
  }
  return `30 ก.ย. ${retireYearBe}`;
}

function calculateAge(birthDateStr) {
  if (!birthDateStr) return null;
  const d = new Date(birthDateStr);
  if (isNaN(d.getTime())) return null;
  const today = new Date();
  let age = today.getFullYear() - d.getFullYear();
  const m = today.getMonth() - d.getMonth();
  if (m < 0 || (m === 0 && today.getDate() < d.getDate())) {
    age--;
  }
  return age >= 0 ? age : null;
}

// Helper: เติมตัวเลือก วัน (1-31) / เดือนภาษาไทย / ปี พ.ศ.
function populateDateDropdowns($day, $month, $year, minYearBE, maxYearBE) {
  if ($day.children('option').length > 1) return; // ทำงานครั้งเดียว
  for (let d = 1; d <= 31; d++) {
    const val = String(d).padStart(2, '0');
    $day.append($('<option>', { value: val, text: d }));
  }
  THAI_MONTHS_LIST.forEach(m => {
    $month.append($('<option>', { value: m.val, text: m.name }));
  });
  const curBE = new Date().getFullYear() + 543;
  const topYear = maxYearBE || (curBE + 1);
  const bottomYear = minYearBE || 2480;
  for (let y = topYear; y >= bottomYear; y--) {
    $year.append($('<option>', { value: String(y), text: y }));
  }
}

// คำนวณอายุงาน / อายุราชการ (Tenure Calculation) แบบ ปี และ เดือน
function calculateTenure(dateStr) {
  if (!dateStr) return null;
  const d = new Date(dateStr);
  if (isNaN(d.getTime())) return null;
  const today = new Date();
  let years = today.getFullYear() - d.getFullYear();
  let months = today.getMonth() - d.getMonth();
  let days = today.getDate() - d.getDate();
  if (days < 0) {
    months--;
  }
  if (months < 0) {
    years--;
    months += 12;
  }
  if (years < 0) return null;
  return { years, months };
}

function formatTenureText(tenure, prefix) {
  if (!tenure) return '';
  const p = prefix || 'อายุงาน';
  if (tenure.years > 0 && tenure.months > 0) {
    return `${p} ${tenure.years} ปี ${tenure.months} เดือน`;
  } else if (tenure.years > 0) {
    return `${p} ${tenure.years} ปีเต็ม`;
  } else {
    return `${p} ${tenure.months} เดือน`;
  }
}

        }
      });
      isThailandAutocompleteInit = true;
    } catch(err) {
      console.warn('$.Thailand init error:', err);
    }

}

      title: '🔒 กรุณาเข้าสู่ระบบเจ้าหน้าที่',
      html: `
        <div class="py-2 text-start">
          <p class="mb-2 text-dark">ระบบได้จำกัดสิทธิ์การเข้าถึงข้อมูลรายละเอียดประวัติบุคลากร (ก.พ.7) สำหรับผู้ใช้งานที่ผ่านการยืนยันตัวตนแล้วเท่านั้นค่ะ</p>

            <i class="fa-solid fa-shield-halved me-1"></i> เพื่อการคุ้มครองข้อมูลส่วนบุคคล (PDPA) และระเบียบทางราชการ

      `,
      showCancelButton: true,
      confirmButtonText: '<i class="fa-solid fa-right-to-bracket me-1"></i> เข้าสู่ระบบเจ้าหน้าที่',
      cancelButtonText: 'กลับหน้าเดิม',
      confirmButtonColor: '#1d4ed8'
    }).then((result) => {
      if (result.isConfirmed) {
        openLoginModal();

    return;

  showPpmsLoading('กำลังดึงข้อมูลประวัติ...', 'รหัส PIN: #' + pin);
  google.script.run
    .withSuccessHandler(function(res) {

    })
    .getPersonnelDetail(pin);

// -------------------------------------------------------------------------
// Helper: ระบบออกแบบสี Badge สถานะการปฏิบัติงาน (Work Status Semantic Badges)
// ครอบคลุม 8 กลุ่มสถานะมาตรฐาน พร้อมระบบสีและไอคอนตามหลักจิตวิทยา
// -------------------------------------------------------------------------
function renderWorkStatusBadge(statusText, isSmall) {
  const raw = (statusText || 'ปกติ/ปฏิบัติงาน/ข้าราชการ/รับโอน').trim();
  const lower = raw.toLowerCase();
  const sz = isSmall
    ? 'font-size: 0.74rem; padding: 0.20rem 0.60rem;'
    : 'font-size: 0.84rem; padding: 0.35rem 0.90rem;';

  // 1. กำลังปฏิบัติงาน / ปกติ / ย้ายเข้า สบช. (Active) -> 🟢 เขียวมรกตนุ่มนวล Soft Emerald
  if (
    lower === 'กำลังปฏิบัติงาน' ||
    lower === 'ปกติ' ||
    lower.includes('ปกติ/ปฏิบัติงาน') ||
    lower.includes('ย้ายข้าราชการมา สบช') ||
    lower.includes('ตัดโอนตำแหน่ง/เงินเดือน มา สบช')
  ) {
    const label = (raw.includes('ปกติ/ปฏิบัติงาน') || raw === 'ปกติ' || !raw) ? 'กำลังปฏิบัติงาน' : raw;
    return `<span class="badge rounded-pill fw-bold shadow-sm" style="background-color: #dcfce7; color: #15803d; border: 1px solid #86efac; ${sz}">
      <i class="fa-solid fa-circle-check me-1 text-success"></i>${label}
    </span>`;
  }

  // 2. ช่วยราชการ (Secondment) -> 🔵 ฟ้าสว่างสดใส Sky Blue
  if (lower.includes('ช่วยราชการ')) {
    return `<span class="badge rounded-pill fw-bold shadow-sm" style="background-color: #e0f2fe; color: #0284c7; border: 1px solid #7dd3fc; ${sz}">
      <i class="fa-solid fa-people-arrows me-1"></i>${raw}
    </span>`;
  }

  // 3. ลาศึกษาต่อ (Study Leave) -> 🟡 ส้มอำพันวิชาการ Warm Amber
  if (lower.includes('ศึกษาต่อ') || lower.includes('เรียน') || lower.includes('study')) {
    return `<span class="badge rounded-pill fw-bold shadow-sm" style="background-color: #fef3c7; color: #b45309; border: 1px solid #fcd34d; ${sz}">
      <i class="fa-solid fa-graduation-cap me-1"></i>${raw}
    </span>`;
  }

  // 4. โอนย้ายไปใน สบช. (Internal Transfer) -> 🟣 ม่วงพาสเทล Soft Violet
  if (lower.includes('โอนย้ายไปใน สบช') || lower.includes('ย้ายภายใน สบช') || lower.includes('โอนย้ายใน สบช')) {
    return `<span class="badge rounded-pill fw-bold shadow-sm" style="background-color: #f3e8ff; color: #7e22ce; border: 1px solid #d8b4fe; ${sz}">
      <i class="fa-solid fa-arrow-right-arrow-left me-1"></i>โอนย้ายไปใน สบช.
    </span>`;
  }

  // 5. โอนย้ายไปนอก สบช. / ย้ายออกนอก (External Transfer) -> 🟪 ม่วงครามเข้ม/อินดิโก Indigo Muted
  if (
    lower.includes('โอนย้ายไปนอก สบช') ||
    lower.includes('ให้โอนข้าราชการไปนอก สบช') ||
    lower.includes('ย้ายข้าราชการออกไปนอก สบช') ||
    lower.includes('ย้ายไปคณะแพทย์') ||
    lower.includes('โอนออก') ||
    lower.includes('ย้ายออก')
  ) {
    return `<span class="badge rounded-pill fw-bold shadow-sm" style="background-color: #ede9fe; color: #4338ca; border: 1px solid #c4b5fd; ${sz}">
      <i class="fa-solid fa-right-from-bracket me-1"></i>โอนย้ายไปนอก สบช.
    </span>`;
  }

  // 6. เกษียณอายุราชการ (Retired) -> ⚪ เทาเงินสุภาพ Slate Gray
  if (lower.includes('เกษียณ')) {
    return `<span class="badge rounded-pill fw-bold shadow-sm" style="background-color: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; ${sz}">
      <i class="fa-solid fa-user-clock me-1"></i>เกษียณอายุ
    </span>`;
  }

  // 7. ลาออก / พ้นสภาพ (Resigned) -> 🔴 แดงกุหลาบสุภาพ Rose Muted
  if (lower.includes('ลาออก') || lower.includes('พ้นสภาพ') || lower.includes('resigned')) {
    return `<span class="badge rounded-pill fw-bold shadow-sm" style="background-color: #ffe4e6; color: #be123c; border: 1px solid #fda4af; ${sz}">
      <i class="fa-solid fa-person-walking-arrow-right me-1"></i>ลาออก
    </span>`;
  }

  // 8. เสียชีวิต (Deceased) -> ⚫ ดำ/เทาเข้มสำรวม Dark Slate
  if (lower.includes('เสียชีวิต') || lower.includes('ตาย')) {
    return `<span class="badge rounded-pill fw-bold shadow-sm" style="background-color: #e2e8f0; color: #1e293b; border: 1px solid #94a3b8; ${sz}">
      <i class="fa-solid fa-ribbon me-1"></i>เสียชีวิต
    </span>`;
  }

  // Default Fallback
  return `<span class="badge rounded-pill fw-bold shadow-sm" style="background-color: #f8fafc; color: #334155; border: 1px solid #e2e8f0; ${sz}">
    <i class="fa-solid fa-circle-info me-1"></i>${raw}
  </span>`;
}

function renderPersonnelInPaneDetail(data) {
  window.currentPersonnelData = data || {};
  const p = data.profile || {};
  const edus = data.educations || [];
  const studies = data.studies || [];
  const bonds = data.bonds || [];
  const licenses = data.licenses || [];

  const titleTh = (p.title_th || '').trim();
  const fnameTh = (p.fname_th || p.master_fname || '').trim();
  const lnameTh = (p.lname_th || p.master_lname || '').trim();
  const fullNameTh = [titleTh, fnameTh, lnameTh].filter(Boolean).join(' ');

  const titleEn = (p.title_en || '').trim();
  const fnameEn = (p.fname_en || '').trim();
  const lnameEn = (p.lname_en || '').trim();
  const fullNameEn = [titleEn, fnameEn, lnameEn].filter(Boolean).join(' ');

  // Profile Section 1
  const rawPhoto = p.photo_url || p.master_photo || '';
  const avatarUrl = formatStaffPhotoUrl(rawPhoto) || DEFAULT_STAFF_AVATAR;
  $('#inPaneAvatarImg').attr('src', avatarUrl);

  // สถานะใต้รูปถ่าย แสดงด้วย Semantic Badge ตามกลุ่มสถานะจริง (ขนาดใหญ่)
  const activeWorkStatus = (p.work_status === 'กำลังปฏิบัติงาน' || !p.work_status) ? 'ปกติ/ปฏิบัติงาน/ข้าราชการ/รับโอน' : p.work_status;
  if ($('#inPaneWorkStatusBadgeContainer').length > 0) {
    $('#inPaneWorkStatusBadgeContainer').html(renderWorkStatusBadge(activeWorkStatus, false));
  } else if ($('#inPaneWorkStatusBadge').length > 0) {
    $('#inPaneWorkStatusBadge').replaceWith(renderWorkStatusBadge(activeWorkStatus, false));
  }

  const curRole = (window.currentUserRole || 'guest').toLowerCase();
  const curPin = String(window.currentUserPin || '');
  const targetPin = String(p.pin || p.user_pin || p.staff_id || '');
  window.currentViewingPin = targetPin;
  const isSelf = (Boolean(curPin) && Boolean(targetPin) && curPin === targetPin);
  const isAdmin = (curRole === 'super_admin' || curRole === 'hr_admin');
  const isExecutive = (curRole === 'executive');
  const isFullAccess = (isSelf || isAdmin || isExecutive);

  // สิทธิ์แก้ไขข้อมูลส่วนตัว: เฉพาะเจ้าของประวัติตนเอง หรือ HR Admin / Super Admin เท่านั้น (คนอื่นห้ามแก้เด็ดขาด)
  if (isSelf || isAdmin) {
    $('#btnEditPersonnelProfile')
      .removeClass('d-none')
      .attr('onclick', `openPersonnelEditInPane('${targetPin}')`);
  } else {
    $('#btnEditPersonnelProfile').addClass('d-none');
  }

  // สิทธิ์พิมพ์รายงาน ก.พ.7: แต่ละคนพิมพ์ของตนเองได้ หรือ Admin พิมพ์ได้
  if (isSelf || isAdmin) {
    $('#btnPrintKp7Report')
      .removeClass('d-none')
      .attr('onclick', `openPrintKp7Report('${targetPin}')`);
  } else {
    $('#btnPrintKp7Report').addClass('d-none');
  }

  // สิทธิ์การบันทึก/เพิ่มข้อมูล 6 แท็บพันธกิจ ก.พ.7 (การศึกษา, ศึกษาต่อ, เครื่องราชฯ, ใบอนุญาต, การอบรม, รางวัล)
  // ให้เฉพาะเจ้าหน้าที่ HR หรือ แอดมิน (isAdmin) บันทึกได้เท่านั้น บุคลากรทั่วไปเป็น Read-Only
  if (isAdmin) {
    $('.btn-hr-admin-only').removeClass('d-none');
  } else {

  $('#inPaneAdminPos').text(p.admin_position || p.department_head || 'ไม่มี');

  $('#inPaneProfPos').text(p.position_title || p.position || 'บุคลากร');
  const deptParts = [p.main_group, p.department].filter(Boolean);
  $('#inPaneDept').text(deptParts.length > 0 ? deptParts.join(' » ') : '-');

  // 1. ประเภทบุคลากร (ตัดสิทธิ์ล็อกอิน 'user', 'admin', 'staff', 'guest' ออกเด็ดขาด)

  let displayJobLine = (p.job_line || '').trim();
  if (!displayJobLine) {
    const posTitleStr = String(p.position_title || p.position || '');
    if (posTitleStr.includes('อาจารย์') || p.academic_branch) {

  } else {

      .html('<i class="fa-solid fa-briefcase me-1"></i>สายสนับสนุน');
  }


  if (p.academic_branch && p.job_line === 'สายสอน') {

  $('#inPaneCurrentStatus').html(renderWorkStatusBadge(displayCurrentStatus, true));
  if (p.secondment_location && String(p.work_status || '').indexOf('ช่วยราชการ') !== -1) {

  const startTenure = calculateTenure(p.start_working_date);

  $('#inPaneStartDate').html(p.start_working_date ? `${formatDateTh(p.start_working_date)}${startTenureBadge}` : '-');

  const govTenure = calculateTenure(p.gov_service_date);
  const govTenureBadge = govTenure ? ` <span class="badge bg-success-subtle text-success border border-success-subtle rounded-pill ms-1" style="font-size:0.72rem;"><i class="fa-solid fa-building-columns me-1"></i>${formatTenureText(govTenure, 'อายุราชการ')}</span>` : '';
  $('#inPaneGovDate').html(p.gov_service_date ? `${formatDateTh(p.gov_service_date)}${govTenureBadge}` : '-');

  // ข้อมูลการปรับเข้าสู่ตำแหน่งอาจารย์ (ก.ค.ศ.) เพื่อขอผลงานวิชาการ (ผศ./รศ.)
  const posTypeStr = String(p.position_type || p.master_user_type || '');

    $('#inPaneKksRow').addClass('d-none');
  }

  // Tab 1: ประวัติการศึกษา
  const $eduTbody = $('#inPaneEduTableBody');
  $eduTbody.empty();
  $('#inPaneEduCount').text(`ทั้งหมด ${edus.length} รายการ`);
  if (edus.length === 0) {
    $eduTbody.html('<tr><td colspan="8" class="text-center py-4 text-muted">ไม่มีข้อมูลประวัติการศึกษา</td></tr>');
  } else {
    // เรียงลำดับ: วุฒิสูงสุด อยู่บนสุดเสมอ -> ปีที่จบการศึกษาล่าสุดขึ้นมาก่อน (DESC)
    const sortedEdus = [...edus].sort((a, b) => {
      const aHigh = (a.is_highest == 1) ? 1 : 0;
      const bHigh = (b.is_highest == 1) ? 1 : 0;
      if (aHigh !== bHigh) return bHigh - aHigh;
      const aYear = parseInt(a.grad_year, 10) || 0;
      const bYear = parseInt(b.grad_year, 10) || 0;
      if (aYear !== bYear) return bYear - aYear;
      return (b.id || 0) - (a.id || 0);
    });
    sortedEdus.forEach((e, idx) => {
      const isHighBadge = (e.is_highest == 1)
        ? '<span class="badge bg-success-subtle text-success border rounded-pill"><i class="fa-solid fa-star me-1"></i>วุฒิสูงสุด</span>'
        : '<span class="text-muted">-</span>';
      $eduTbody.append(`
        <tr>
          <td class="text-center fw-bold">${idx + 1}</td>
          <td><span class="badge bg-light text-dark border">${e.edu_level || '-'}</span></td>
          <td class="fw-semibold text-dark">
            ${e.degree_name || '-'}

          </td>

          <td class="text-center">${e.grad_year || '-'}</td>
          <td>${e.institution || '-'}</td>
          <td class="text-center">${e.country || 'ไทย'}</td>
          <td class="text-center">${isHighBadge}</td>
        </tr>
      `);
    });

  const $studyTbody = $('#inPaneStudyTableBody');

  const totalStudies = studies.length;

    $studyTbody.html('<tr><td colspan="9" class="text-center py-4 text-muted">ไม่มีบันทึกข้อมูลการศึกษาต่อหรือสัญญาชดใช้ทุน</td></tr>');
  } else {
    studies.forEach((s, idx) => {
      const modalityLabels = {
        'full_time_leave': '1. ลาศึกษาต่อเต็มเวลา',
        'part_time_off_hours': '2. ศึกษานอกเวลาราชการ',
        'informal_study': '3. ศึกษาเพื่อทำวิทยานิพนธ์',
        'partial_leave': '4. ลาศึกษาบางส่วน'
      };
      const modLabel = modalityLabels[s.study_modality] || s.study_modality || '-';
      const period = (s.approved_start_date && s.approved_end_date)
        ? `${formatDateTh(s.approved_start_date)} ถึง ${formatDateTh(s.approved_end_date)}`
        : '-';

      // ค้นหาสัญญาผูกพันที่ตรงกัน
      const b = bonds.find(item => item.study_id == s.id) || {};
      const multiplier = isFullAccess ? (b.service_multiplier ? `${b.service_multiplier} เท่า` : '2.0 เท่า') : '<span class="text-muted">-</span>';
      const contractDisplay = isFullAccess ? (b.contract_no || s.approval_doc_no || '-') : '<span class="text-muted"><i class="fa-solid fa-lock me-1"></i>จำกัดสิทธิ์</span>';
      const bondStatus = b.bond_status || 'waiting';
      const statusBadge = (bondStatus === 'discharged')
        ? '<span class="badge bg-success-subtle text-success border">ปลอดหนี้ผูกพัน</span>'
        : (bondStatus === 'in_service'
          ? '<span class="badge bg-info-subtle text-info border">กำลังชดใช้ทุน</span>'
          : '<span class="badge bg-warning-subtle text-warning border">ระหว่างศึกษา</span>');

      $studyTbody.append(`
        <tr>
          <td class="text-center fw-bold">${idx + 1}</td>
          <td><span class="badge bg-primary-subtle text-primary border">${modLabel}</span></td>
          <td class="fw-semibold text-dark">${s.degree_level || ''} ${s.program_name || '-'}</td>
          <td>${s.institution || '-'}</td>
          <td>${s.funding_name || s.funding_type || 'ทุนส่วนตัว'}</td>
          <td class="small">${period}</td>
          <td><span class="badge bg-light text-secondary border">${contractDisplay}</span></td>
          <td class="text-center">${multiplier}</td>
          <td class="text-center">${statusBadge}</td>
        </tr>
      `);

  // Tab 3: เครื่องราชอิสริยาภรณ์
  const insignias = data.insignias || [];
  const $insigniaTbody = $('#inPaneInsigniaTableBody');
  $insigniaTbody.empty();
  if (insignias.length === 0) {
    $insigniaTbody.html('<tr><td colspan="6" class="text-center py-4 text-muted"><i class="fa-solid fa-medal fs-3 d-block mb-2 text-warning opacity-50"></i>ยังไม่มีบันทึกข้อมูลเครื่องราชอิสริยาภรณ์ในระบบ</td></tr>');
  } else {
    const curYearBe = new Date().getFullYear() + 543;
    const canManageInsignia = (window.currentUserRole === 'super_admin' || window.currentUserRole === 'hr_admin' || window.currentUserRole === 'admin');
    insignias.forEach((insig, idx) => {
      const recYear = Number(insig.received_year) || 0;
      const yearsHolding = recYear > 0 ? (curYearBe - recYear) : 0;
      const isRjp = (insig.insignia_class === 'ร.จ.พ.' || String(insig.insignia_name).includes('จักรพรรดิมาลา'));
      
      let holdingBadge = '';
      if (isRjp) {
        holdingBadge = '<span class="badge rounded-pill px-2 py-1 fw-semibold" style="background-color: #f3e8ff; color: #7e22ce; border: 1px solid #d8b4fe;"><i class="fa-solid fa-shield-halved me-1"></i>เหรียญบำเหน็จ (ร.จ.พ.)</span>';
      } else if (yearsHolding >= 5) {
        holdingBadge = '<span class="badge rounded-pill px-2 py-1 fw-semibold" style="background-color: #dcfce7; color: #15803d; border: 1px solid #86efac;"><i class="fa-solid fa-check me-1"></i>ครองครบ ' + yearsHolding + ' ปี (พร้อมขอชั้นถัดไป)</span>';
      } else {
        const remaining = 5 - yearsHolding;
        holdingBadge = '<span class="badge rounded-pill px-2 py-1 fw-semibold" style="background-color: #fef9c3; color: #a16207; border: 1px solid #fde047;"><i class="fa-solid fa-clock me-1"></i>ครองแล้ว ' + yearsHolding + ' ปี (ขาดอีก ' + remaining + ' ปี)</span>';
      }

      if (insig.gazette_volume) parts.push('เล่ม ' + insig.gazette_volume);
      if (insig.gazette_issue) parts.push('ตอน ' + insig.gazette_issue);

      if (insig.gazette_item_no) parts.push('ลำดับ ' + insig.gazette_item_no);
      gazetteInfo = parts.join(' ') || '-';

        docBtn = ' <a href="' + insig.doc_url + '" target="_blank" class="btn btn-xs btn-outline-primary ms-1 px-2 py-0" title="เปิดดูประกาศราชกิจจานุเบกษา"><i class="fa-solid fa-file-pdf"></i></a>';
      }

      let actionBtns = '';
      if (canManageInsignia) {
        actionBtns = '<div class="btn-group btn-group-sm ms-2">' +
          '<button type="button" class="btn btn-outline-warning btn-xs px-2 py-0" onclick="event.stopPropagation(); editInsigniaRecord(' + insig.id + ')" title="แก้ไขข้อมูล"><i class="fa-solid fa-pen"></i></button>' +
          '<button type="button" class="btn btn-outline-danger btn-xs px-2 py-0" onclick="event.stopPropagation(); deleteInsigniaRecordById(' + insig.id + ', \'' + viewingPin + '\')" title="ลบข้อมูล"><i class="fa-solid fa-trash"></i></button>' +
          '</div>';
      }

      const gazetteDateStr = insig.gazette_date ? (typeof formatThaiDateShort === 'function' ? formatThaiDateShort(insig.gazette_date) : insig.gazette_date) : '-';

      const rowHtml = '<tr>' +
        '<td class="text-center fw-bold text-muted" style="width: 50px;">' + (idx + 1) + '</td>' +
        '<td>' +
          '<span class="badge rounded-pill px-2 py-1 fw-bold me-1" style="background-color: #fef3c7; color: #b45309; border: 1px solid #fcd34d;">' + insig.insignia_class + '</span> ' +
          '<span class="fw-semibold text-dark">' + insig.insignia_name + '</span>' +
        '</td>' +
        '<td class="text-center fw-bold text-primary">' + (insig.received_year || '-') + '</td>' +
        '<td>' + gazetteDateStr + '</td>' +
        '<td><span class="text-muted small">' + gazetteInfo + '</span>' + docBtn + '</td>' +
        '<td class="text-center">' + holdingBadge + actionBtns + '</td>' +

  const $licTbody = $('#inPaneLicenseTableBody');
  $licTbody.empty();
  $('#inPaneLicenseCount').text(`ทั้งหมด ${licenses.length} รายการ`);
  if (licenses.length === 0) {
    $licTbody.html('<tr><td colspan="11" class="text-center py-4 text-muted"><i class="bi bi-folder2-open fs-3 d-block mb-2 text-secondary opacity-50"></i>ไม่มีข้อมูลใบอนุญาตประกอบวิชาชีพหรือบัตรข้าราชการ</td></tr>');
  } else {
    const canManageLicense = (window.currentUserRole === 'super_admin' || window.currentUserRole === 'hr_admin' || window.currentUserRole === 'admin');
    licenses.forEach((l, idx) => {
      const catBadge = (l.doc_category === 'civil_card')
        ? '<span class="badge bg-secondary-subtle text-secondary border"><i class="bi bi-person-badge me-1"></i>บัตรข้าราชการ/บัตรพนักงานราชการ</span>'
        : '<span class="badge bg-primary-subtle text-primary border"><i class="bi bi-award me-1"></i>ใบอนุญาตวิชาชีพ</span>';

      const roundBadge = Number(l.renewal_round) === 0
        ? '<span class="badge bg-info-subtle text-info border">ครั้งแรก</span>'
        : '<span class="badge bg-light text-dark border">ต่ออายุ ครั้งที่ ' + (l.renewal_round || 1) + '</span>';

      // คำนวณวันหมดอายุและสถานะ
      let daysLeft = l.days_left;
      if (daysLeft === undefined || daysLeft === null) {
        if (l.expiry_date) {
          const exp = new Date(l.expiry_date);
          const now = new Date();
          daysLeft = Math.ceil((exp - now) / (1000 * 60 * 60 * 24));
        }
      }

      let countdownBadge = '-';
      let statBadge = '';
      if (daysLeft !== undefined && daysLeft !== null && !isNaN(daysLeft)) {
        if (daysLeft < 0) {
          countdownBadge = `<span class="badge bg-danger text-white rounded-pill px-2 py-1"><i class="bi bi-x-circle me-1"></i>หมดอายุ ${Math.abs(daysLeft)} วัน</span>`;
          statBadge = '<span class="badge bg-danger text-white border"><i class="bi bi-exclamation-octagon-fill me-1"></i>หมดอายุแล้ว</span>';
        } else if (daysLeft <= 30) {

// จัดการคำนำหน้าชื่อระบบจากตาราง hr_prefixes (Modular Prefix Table)
// -------------------------------------------------------------------------
window.systemPrefixes = [];

function loadPrefixDropdowns(callback) {
  if (window.systemPrefixes && window.systemPrefixes.length > 0) {
    populatePrefixDropdowns();
    if (typeof callback === 'function') callback();
    return;
  }
  google.script.run
    .withSuccessHandler(function(res) {
      if (res && res.status === 'success' && Array.isArray(res.data) && res.data.length > 0) {
        window.systemPrefixes = res.data;
      }
      populatePrefixDropdowns();
      if (typeof callback === 'function') callback();
    })
    .withFailureHandler(function(err) {
      console.warn('Cannot load prefixes from server:', err);
      populatePrefixDropdowns();
      if (typeof callback === 'function') callback();
    })
    .getPrefixes();
}

function populatePrefixDropdowns() {
  const list = window.systemPrefixes || [];
  const $th = $('#inPaneEditTitleTh');
  const $en = $('#inPaneEditTitleEn');
  
  const currentTh = $th.val();
  const currentEn = $en.val();

  $th.empty().append('<option value="">-- เลือกคำนำหน้า (TH) --</option>');
  $en.empty().append('<option value="">-- Select Prefix (ENG) --</option>');

  const enMap = {};

  list.forEach(function(item) {
    if (item.prefix_th) {
      $th.append($('<option>', {
        value: item.prefix_th,
        text: item.prefix_th,
        'data-en': item.prefix_en || '',
        'data-gender': item.gender || ''
      }));
    }
    if (item.prefix_en && !enMap[item.prefix_en]) {
      enMap[item.prefix_en] = true;
      $en.append($('<option>', {
        value: item.prefix_en,
        text: item.prefix_en
      }));
    }
  });

  if (currentTh) $th.val(currentTh);
  if (currentEn) $en.val(currentEn);
}

function onTitleThChanged(thVal) {
  if (!thVal) return;
  const match = (window.systemPrefixes || []).find(function(p) {
    return p.prefix_th === thVal;
  });
  if (match) {
    if (match.prefix_en) {
      if ($('#inPaneEditTitleEn option[value="' + match.prefix_en + '"]').length === 0) {
        $('#inPaneEditTitleEn').append($('<option>', { value: match.prefix_en, text: match.prefix_en }));
      }
      $('#inPaneEditTitleEn').val(match.prefix_en);
    }
    if (match.gender) {
      $('#inPaneEditGender').val(match.gender);
    }
  }
}

function updateAdminPositionPreview() {
  const curAdminPos = $('#inPaneEditAdminPosSelect').val();
  const $customInput = $('#inPaneEditAdminPositionCustom');
  const $hiddenInput = $('#inPaneEditAdminPosition');
  const $preview = $('#inPaneAdminPosPreview');

  if (!curAdminPos) {
    $customInput.addClass('d-none').val('');
    $hiddenInput.val('');
    $preview.addClass('d-none').text('');
    return;
  }

  if (curAdminPos === 'custom') {
    $customInput.removeClass('d-none');
    $hiddenInput.val($customInput.val());
    $preview.addClass('d-none').text('');
    return;
  }

  $customInput.addClass('d-none').val('');

  let title = curAdminPos;
  if (curAdminPos === 'หัวหน้าสาขา') {
    const branch = $('#inPaneEditAcademicBranch').val() ? $('#inPaneEditAcademicBranch').val().trim() : '';
    title = branch ? ('หัวหน้าสาขา' + branch) : 'หัวหน้าสาขา';
  } else if (curAdminPos === 'หัวหน้ากลุ่มงาน') {
    const dept = $('#inPaneEditDepartment').val() ? $('#inPaneEditDepartment').val().trim() : '';
    if (dept) {
      title = dept.startsWith('งาน') ? ('หัวหน้า' + dept) : ('หัวหน้างาน' + dept);
    } else {
      title = 'หัวหน้างาน';
    }
  } else if (curAdminPos === 'ผู้รับผิดชอบหลักสูตร') {
    title = 'ผู้รับผิดชอบหลักสูตรพยาบาลศาสตรบัณฑิต';
  } else if (curAdminPos === 'อาจารย์ประจำหลักสูตร') {
    title = 'อาจารย์ประจำหลักสูตรพยาบาลศาสตรบัณฑิต';
  }

  $hiddenInput.val(title);
  $preview.removeClass('d-none').html('<i class="fa-solid fa-circle-check me-1 text-success"></i>แสดงผลเป็น: <strong class="text-dark">' + title + '</strong>');
}

            $('.service-admin-col, .salary-admin-col').hide();
          }
          $('#inPaneEditStartWorkDay, #inPaneEditStartWorkMonth, #inPaneEditStartWorkYearBE, #inPaneEditGovDay, #inPaneEditGovMonth, #inPaneEditGovYearBE, #inPaneEditKksDay, #inPaneEditKksMonth, #inPaneEditKksYearBE')
            .prop('disabled', !isAdmin)

            .prop('readonly', !isAdmin)
            .css('background-color', isAdmin ? '#ffffff' : '#f8fafc');

          // 3. สถานะการลาศึกษาต่อ (Tab 6): HR เท่านั้นที่บันทึก

          // 4. รูปถ่ายประจำตัวทางการ (Tab 1): HR เท่านั้นที่บันทึก บุคลากรทั่วไปดูได้อย่างเดียว
          $('#inPaneEditPhotoUrl')
            .prop('readonly', !isAdmin)
            .css('background-color', isAdmin ? '#ffffff' : '#f8fafc');

            $('#alertRolePhotoNotice').addClass('d-none');

            $('#alertRolePhotoNotice').removeClass('d-none');
          }

          $('#inPaneEditStaffId').val(p.pin || p.user_pin || targetPin);
          $('#inPaneEditPositionNumber').val(p.position_number || '');
          let pWorkStatus = (p.work_status === 'กำลังปฏิบัติงาน' || !p.work_status) ? 'ปกติ/ปฏิบัติงาน/ข้าราชการ/รับโอน' : p.work_status;
          // Normalization ค่าสถานะเดิมให้ตรงกับมาตรฐานใหม่
          if (pWorkStatus === 'ให้โอนข้าราชการไปนอก สบช.' || pWorkStatus === 'ย้ายข้าราชการออกไปนอก สบช.' || pWorkStatus === 'ย้ายไปคณะแพทย์') {
            pWorkStatus = 'โอนย้ายไปนอก สบช.';
          } else if (pWorkStatus === 'เกษียณ') {
            pWorkStatus = 'เกษียณอายุ';
          }
          if ($('#inPaneEditWorkStatus option[value="' + pWorkStatus + '"]').length === 0 && pWorkStatus) {
            $('#inPaneEditWorkStatus').append($('<option>', { value: pWorkStatus, text: pWorkStatus }));

          $('#inPaneEditWorkStatus').val(pWorkStatus);
          $('#inPaneEditSecondmentLocation').val(p.secondment_location || '');
          onWorkStatusChanged(pWorkStatus);
          $('#inPaneEditPositionTitle').val(p.position_title || p.position || '');

          const rawPosType = (p.position_type || '').trim();
          const isInvalidRole = ['user', 'admin', 'staff', 'guest', 'hr_admin', 'super_admin'].includes(rawPosType.toLowerCase());
          const masterRole = (p.master_user_type || '').trim();
          const isMasterRoleInvalid = ['user', 'admin', 'staff', 'guest', 'hr_admin', 'super_admin'].includes(masterRole.toLowerCase());
          
          let posType = (!isInvalidRole && rawPosType) ? rawPosType : ((!isMasterRoleInvalid && masterRole) ? masterRole : 'ข้าราชการ (ก.พ.)');
          if ($('#inPaneEditPositionType option[value="' + posType + '"]').length === 0 && posType) {
            $('#inPaneEditPositionType').append($('<option>', { value: posType, text: posType }));
          }
          $('#inPaneEditPositionType').val(posType);
          onPositionTypeChanged(posType);

          const pJobLine = p.job_line || 'สายสอน';
          $('#inPaneEditJobLine').val(pJobLine);
          onJobLineChanged(pJobLine);

          // ตั้งค่ากลุ่มและงานย่อย
          const pMainGroup = p.main_group || (pJobLine === 'สายสอน' ? 'กลุ่มวิชาการ' : 'กลุ่มบริหารและยุทธศาสตร์');
          $('#inPaneEditMainGroup').val(pMainGroup);
          onMainGroupChanged(pMainGroup, p.department || (pJobLine === 'สายสอน' ? 'งานสาขาวิชา' : ''));

          // ตั้งค่าสาขาวิชา (5 สาขา)
          const pBranch = p.academic_branch || '';
          if (pBranch) {
            if ($('#inPaneEditAcademicBranchSelect option[value="' + pBranch + '"]').length > 0) {
              $('#inPaneEditAcademicBranchSelect').val(pBranch);
              $('#inPaneEditAcademicBranch').addClass('d-none').val(pBranch);
            } else {
              $('#inPaneEditAcademicBranchSelect').val('custom');
              $('#inPaneEditAcademicBranch').removeClass('d-none').val(pBranch);
            }
          } else {
            $('#inPaneEditAcademicBranchSelect').val('');
            $('#inPaneEditAcademicBranch').addClass('d-none').val('');
          }

          // ตั้งค่าข้อมูลการปรับตำแหน่งอาจารย์ (ก.ค.ศ.)
          initKksDateDropdowns();

          $('#inPaneEditKksAppointedDate').val(rawKks);
          if (rawKks && rawKks.includes('-')) {
            const parts = rawKks.split('-');
            const yCE = parseInt(parts[0], 10);
            const m = parseInt(parts[1], 10);
            const d = parseInt(parts[2], 10);
            if (!isNaN(yCE) && !isNaN(m) && !isNaN(d)) {
              $('#inPaneEditKksYearBE').val(String(yCE + 543));
              $('#inPaneEditKksMonth').val(String(m).padStart(2, '0'));
              $('#inPaneEditKksDay').val(String(d).padStart(2, '0'));
              syncKksDateBEtoAD();
            }
          } else {
            $('#inPaneEditKksDay').val('');
            $('#inPaneEditKksMonth').val('');
            $('#inPaneEditKksYearBE').val('');
            $('#inPaneEditKksTenureBadge').addClass('d-none').text('');
          }
          $('#inPaneEditKksOrderNumber').val(p.kks_order_number || '');
          updateKksCardVisibility();

          // ตั้งค่าความเชี่ยวชาญ & บทบาทหลักสูตร
          $('#inPaneEditExpertiseTeaching').val(p.expertise_teaching || '');
          $('#inPaneEditExpertiseResearch').val(p.expertise_research || '');
          $('#inPaneEditBachelorRole').val(p.bachelor_program_role || '');
          $('#inPaneEditMasterRole').val(p.master_program_role || '');
          $('#inPaneEditSupportDuty').val(p.further_study_status || '');

          // ตั้งค่าตำแหน่งทางการบริหาร
          const pAdminPos = p.admin_position || '';
          $('#inPaneEditAdminPosition').val(pAdminPos);
          if (!pAdminPos || pAdminPos === 'ไม่มี') {
            $('#inPaneEditAdminPosSelect').val('');
            $('#inPaneEditAdminPositionCustom').addClass('d-none').val('');
          } else if (pAdminPos.startsWith('หัวหน้าสาขา')) {
            $('#inPaneEditAdminPosSelect').val('หัวหน้าสาขา');
            $('#inPaneEditAdminPositionCustom').addClass('d-none').val('');
          } else if (pAdminPos.startsWith('หัวหน้างาน') || pAdminPos.startsWith('หัวหน้ากลุ่มงาน')) {
            $('#inPaneEditAdminPosSelect').val('หัวหน้ากลุ่มงาน');
            $('#inPaneEditAdminPositionCustom').addClass('d-none').val('');
          } else if ($('#inPaneEditAdminPosSelect option[value="' + pAdminPos + '"]').length > 0) {
            $('#inPaneEditAdminPosSelect').val(pAdminPos);
            $('#inPaneEditAdminPositionCustom').addClass('d-none').val('');
          } else {
            $('#inPaneEditAdminPosSelect').val('custom');
            $('#inPaneEditAdminPositionCustom').removeClass('d-none').val(pAdminPos);
          }
          updateAdminPositionPreview();

          // ตั้งค่า Dropdown คำนำหน้าชื่อ (TH & EN)
          const titleTh = p.title_th || '';
          if (titleTh) {
            if ($('#inPaneEditTitleTh option[value="' + titleTh + '"]').length === 0) {
              $('#inPaneEditTitleTh').append($('<option>', { value: titleTh, text: titleTh }));
            }
            $('#inPaneEditTitleTh').val(titleTh);
          } else {
            $('#inPaneEditTitleTh').val('');
          }

          const titleEn = p.title_en || '';
          if (titleEn) {
            if ($('#inPaneEditTitleEn option[value="' + titleEn + '"]').length === 0) {
              $('#inPaneEditTitleEn').append($('<option>', { value: titleEn, text: titleEn }));
            }
            $('#inPaneEditTitleEn').val(titleEn);
          } else {
            $('#inPaneEditTitleEn').val('');
          }

          $('#inPaneEditFnameTh').val(p.fname_th || p.master_fname || '');
          $('#inPaneEditLnameTh').val(p.lname_th || p.master_lname || '');
          $('#inPaneEditFnameEn').val(p.fname_en || '');
          $('#inPaneEditLnameEn').val(p.lname_en || '');

          $('#inPaneEditGender').val(p.gender || 'หญิง');
          $('#inPaneEditEthnicity').val(p.ethnicity || 'ไทย');
          $('#inPaneEditNationality').val(p.nationality || 'ไทย');
          $('#inPaneEditReligion').val(p.religion || 'พุทธ');

          // จัดการวันเดือนปีเกิด (พ.ศ.) และคำนวณอายุอัตโนมัติ
          initBirthDateDropdowns();
          const rawBirth = p.birth_date ? p.birth_date.substring(0, 10) : '';
          $('#inPaneEditBirthDate').val(rawBirth);
          if (rawBirth && rawBirth.includes('-')) {
            const parts = rawBirth.split('-');
            const yCE = parseInt(parts[0], 10);
            const m = parseInt(parts[1], 10);
            const d = parseInt(parts[2], 10);
            if (!isNaN(yCE) && !isNaN(m) && !isNaN(d)) {
              $('#inPaneEditBirthYearBE').val(String(yCE + 543));
              $('#inPaneEditBirthMonth').val(String(m).padStart(2, '0'));
              $('#inPaneEditBirthDay').val(String(d).padStart(2, '0'));
              const age = calculateAge(rawBirth);
              if (age !== null && age >= 0) {
                $('#inPaneEditAgeBadge').removeClass('d-none').html(`<i class="fa-solid fa-cake-candles me-1"></i>อายุ ${age} ปี`);
              } else {
                $('#inPaneEditAgeBadge').addClass('d-none').text('');
              }
            }
          } else {
            $('#inPaneEditBirthDay').val('');
            $('#inPaneEditBirthMonth').val('');
            $('#inPaneEditBirthYearBE').val('');
            $('#inPaneEditAgeBadge').addClass('d-none').text('');
          }

          $('#inPaneEditMaritalStatus').val(p.marital_status || 'โสด');
          $('#inPaneEditHometown').val(p.hometown_province || p.hometown || '');

          // เติมข้อมูลครอบครัว (ก.พ.7)
          $('#inPaneEditFatherName').val(p.father_name || '');
          $('#inPaneEditMotherName').val(p.mother_name || '');
          $('#inPaneEditMotherPrevSurname').val(p.mother_prev_surname || '');
          $('#inPaneEditSpouseName').val(p.spouse_name || '');
          $('#inPaneEditSpousePrevSurname').val(p.spouse_prev_surname || '');
          $('#inPaneEditChildrenCount').val((p.children_count !== null && p.children_count !== undefined && p.children_count !== '') ? p.children_count : '');

          initCivilDateDropdowns();
          initThaiAddressAutocomplete();

          // เติมวันเริ่มทำงานในหน่วยงาน (พ.ศ.)
          const rawStart = p.start_working_date ? p.start_working_date.substring(0, 10) : '';
          $('#inPaneEditStartWorkingDate').val(rawStart);
          if (rawStart && rawStart.includes('-')) {
            const parts = rawStart.split('-');
            const yCE = parseInt(parts[0], 10);
            const m = parseInt(parts[1], 10);
            const d = parseInt(parts[2], 10);
            if (!isNaN(yCE) && !isNaN(m) && !isNaN(d)) {
              $('#inPaneEditStartWorkYearBE').val(String(yCE + 543));
              $('#inPaneEditStartWorkMonth').val(String(m).padStart(2, '0'));
              $('#inPaneEditStartWorkDay').val(String(d).padStart(2, '0'));
              syncStartWorkingDateBEtoAD();
            }
          } else {
            $('#inPaneEditStartWorkDay').val('');
            $('#inPaneEditStartWorkMonth').val('');
            $('#inPaneEditStartWorkYearBE').val('');
            $('#inPaneEditStartWorkTenureBadge').addClass('d-none').text('');
          }

          // เติมวันบรรจุรับราชการ ก.พ.7 (พ.ศ.)
          const rawGov = p.gov_service_date ? p.gov_service_date.substring(0, 10) : '';
          $('#inPaneEditGovServiceDate').val(rawGov);
          if (rawGov && rawGov.includes('-')) {
            const parts = rawGov.split('-');
            const yCE = parseInt(parts[0], 10);
            const m = parseInt(parts[1], 10);
            const d = parseInt(parts[2], 10);
            if (!isNaN(yCE) && !isNaN(m) && !isNaN(d)) {
              $('#inPaneEditGovServiceYearBE').val(String(yCE + 543));
              $('#inPaneEditGovServiceMonth').val(String(m).padStart(2, '0'));
              $('#inPaneEditGovServiceDay').val(String(d).padStart(2, '0'));
              syncGovServiceDateBEtoAD();
            }
          } else {
            $('#inPaneEditGovServiceDay').val('');
            $('#inPaneEditGovServiceMonth').val('');
            $('#inPaneEditGovServiceYearBE').val('');
            $('#inPaneEditGovServiceTenureBadge').addClass('d-none').text('');
          }

          const defaultAddressDetail = '45 ถ.อรรถกวี';
          const defaultSubdistrict = 'ปากน้ำโพ';
          const defaultDistrict = 'เมืองนครสวรรค์';
          const defaultProvince = 'นครสวรรค์';
          const defaultPostalCode = '60000';
          const defaultPhone = '056-213741';

          $('#inPaneEditAddressDetail').val(p.address_detail || defaultAddressDetail);
          $('#inPaneEditSubdistrict').val(p.subdistrict || defaultSubdistrict);
          $('#inPaneEditDistrict').val(p.district || defaultDistrict);
          $('#inPaneEditProvince').val(p.province || defaultProvince);
          $('#inPaneEditPostalCode').val(p.postal_code || defaultPostalCode);
          $('#inPaneEditPhoneNumber').val(p.phone_number || defaultPhone);
          $('#inPaneEditEmail').val(p.email || '');

          $('#inPaneEditFurtherStudy').val(p.further_study_status || '');
          const pPhotoUrl = p.photo_url || p.master_photo || '';
          $('#inPaneEditPhotoUrl').val(pPhotoUrl);
          updateEditPhotoPreview(pPhotoUrl);

          $('#inPaneEditSubtitle').text(`รหัส PIN: #${targetPin} • ชื่อ: ${p.title_th || ''}${p.fname_th || p.master_fname || ''} ${p.lname_th || p.master_lname || ''}`);

          // สลับแสดง View แก้ไขแบบ In-Pane Full Width
          $('.tab-pane-content').addClass('d-none');
          $('#view-personnel-edit').removeClass('d-none');

          // โหลดประวัติการรับราชการ (Career Journey) และ ก.พ.7 (เงินเดือน) สำหรับ Tab 4
          loadInPaneServiceHistory(targetPin);
          loadInPaneSalaryHistory(targetPin);

          // โหลดตำแหน่งทางวิชาการ สำหรับ Tab 5
          loadInPaneAcademicPositions(targetPin, res.data.academic_positions);

          // สลับไปแท็บที่กำหนด หรือแท็บเดิมที่ค้างไว้ (Active Tab Persistence)
          const tabToActivate = targetTab || currentPersonnelEditActiveTab || '#editpane-tab-personal';
          const $targetBtn = $('#editPanePillsTab button[data-bs-target="' + tabToActivate + '"]');
          if ($targetBtn.length) {
            $targetBtn.tab('show');
          } else {
            $('#editPanePillsTab button:first').tab('show');
          }
        } else {
          Swal.fire('ข้อผิดพลาด', res ? res.message : 'ไม่สามารถดึงข้อมูลประวัติได้', 'error');
        }
      })
      .withFailureHandler(function(err) {
        hidePpmsLoading();
        Swal.fire('การเชื่อมต่อขัดข้อง', err.message, 'error');
      })
      .getPersonnelDetail(targetPin);
  });
}

function closePersonnelEditPane() {
  $('#view-personnel-edit').addClass('d-none');
  $('#view-personnel-detail').removeClass('d-none');
}

function savePersonnelEditForm() {
  const pin = $('#inPaneEditStaffId').val();
  if (!pin) {
    Swal.fire('ข้อผิดพลาด', 'ไม่พบรหัส PIN', 'error');
    return;
  }

  const curRole = (window.currentUserRole || 'guest').toLowerCase();
  const isAdmin = (curRole === 'super_admin' || curRole === 'hr_admin');
  const curPin = String(window.currentUserPin || '');

  // กฎเหล็กความปลอดภัย: ห้ามบันทึกข้อมูลของคนอื่นเด็ดขาด!
  if (!isAdmin && (!curPin || curPin !== String(pin))) {
    Swal.fire({
      icon: 'error',
      title: 'การกระทำไม่ได้รับอนุญาต',
      text: 'ท่านไม่มีสิทธิ์บันทึกข้อมูลของบุคลากรท่านอื่น ระบบอนุญาตให้บันทึกเฉพาะข้อมูลของตนเองเท่านั้น',
      confirmButtonText: 'ตกลง'
    });
    return;
  }

  // ตรวจสอบชื่อ-นามสกุลภาษาไทย
  const fnameTh = $('#inPaneEditFnameTh').val() ? $('#inPaneEditFnameTh').val().trim() : '';
  const lnameTh = $('#inPaneEditLnameTh').val() ? $('#inPaneEditLnameTh').val().trim() : '';
  if (!fnameTh || !lnameTh) {
    $('#editPanePillsTab button[data-bs-target="#editpane-tab-personal"]').tab('show');
    setTimeout(function() {
      if (!fnameTh) $('#inPaneEditFnameTh').focus();
      else $('#inPaneEditLnameTh').focus();
    }, 200);
    Swal.fire({
      icon: 'warning',
      title: 'กรุณากรอกข้อมูลจำเป็น',
      text: 'กรุณาระบุชื่อและนามสกุล (ภาษาไทย)',
      confirmButtonText: 'ตกลง'
    });
    return;
  }

  // ซิงก์วันเกิด แปลงเป็น ค.ศ. (YYYY-MM-DD) ก่อนส่ง
  if (typeof syncBirthDateBEtoAD === 'function') {
    syncBirthDateBEtoAD();
  }

  // เตรียม Payload พื้นฐาน (ข้อมูลส่วนบุคคล และ ที่อยู่: แท็บ 1 และ แท็บ 2 ที่ User ทั่วไปมีสิทธิ์แก้ไขได้)
  const payload = {
    staff_id: pin,
    title_th: $('#inPaneEditTitleTh').val(),
    fname_th: fnameTh,
    lname_th: lnameTh,
    title_en: $('#inPaneEditTitleEn').val(),
    fname_en: $('#inPaneEditFnameEn').val(),
    lname_en: $('#inPaneEditLnameEn').val(),
    gender: $('#inPaneEditGender').val(),
    ethnicity: $('#inPaneEditEthnicity').val(),
    nationality: $('#inPaneEditNationality').val(),
    religion: $('#inPaneEditReligion').val(),
    birth_date: $('#inPaneEditBirthDate').val() || null,
    marital_status: $('#inPaneEditMaritalStatus').val(),
    father_name: $('#inPaneEditFatherName').val() ? $('#inPaneEditFatherName').val().trim() : null,
    mother_name: $('#inPaneEditMotherName').val() ? $('#inPaneEditMotherName').val().trim() : null,
    mother_prev_surname: $('#inPaneEditMotherPrevSurname').val() ? $('#inPaneEditMotherPrevSurname').val().trim() : null,
    spouse_name: $('#inPaneEditSpouseName').val() ? $('#inPaneEditSpouseName').val().trim() : null,
    spouse_prev_surname: $('#inPaneEditSpousePrevSurname').val() ? $('#inPaneEditSpousePrevSurname').val().trim() : null,
    children_count: ($('#inPaneEditChildrenCount').val() !== '') ? parseInt($('#inPaneEditChildrenCount').val()) : null,
    hometown_province: $('#inPaneEditHometownProvince').val() || null,
    address_detail: $('#inPaneEditAddressDetail').val() || null,
    subdistrict: $('#inPaneEditSubdistrict').val() || null,
    district: $('#inPaneEditDistrict').val() || null,
    province: $('#inPaneEditProvince').val() || null,
    postal_code: $('#inPaneEditPostalCode').val() || null,
    email: $('#inPaneEditEmail').val() || null,
    phone_number: $('#inPaneEditPhoneNumber').val() || null,
    // บุคลากรทุกคนที่เป็นสายสอนสามารถบันทึกและแก้ไขความเชี่ยวชาญของตนเองได้เสมอ
    expertise_teaching: ($('#inPaneEditJobLine').val() === 'สายสอน' && $('#inPaneEditExpertiseTeaching').val()) ? $('#inPaneEditExpertiseTeaching').val().trim() : null,
    expertise_research: ($('#inPaneEditJobLine').val() === 'สายสอน' && $('#inPaneEditExpertiseResearch').val()) ? $('#inPaneEditExpertiseResearch').val().trim() : null
  };

  // หากเป็น HR Admin หรือ Super Admin เท่านั้น จึงจะส่งข้อมูลตำแหน่ง สังกัด บทบาทหลักสูตร และ ก.พ.7 ไปบันทึก
  if (isAdmin) {
    if (typeof syncKksDateBEtoAD === 'function') {
      syncKksDateBEtoAD();
    }
    const posTitle = $('#inPaneEditPositionTitle').val() ? $('#inPaneEditPositionTitle').val().trim() : '';
    const isFacultyJob = ($('#inPaneEditJobLine').val() === 'สายสอน');
    payload.position_number = $('#inPaneEditPositionNumber').val();
    payload.work_status = $('#inPaneEditWorkStatus').val() || 'ปกติ/ปฏิบัติงาน/ข้าราชการ/รับโอน';
    payload.secondment_location = ($('#inPaneEditSecondmentLocation').val() ? $('#inPaneEditSecondmentLocation').val().trim() : null);
    payload.position_title = posTitle;
    payload.admin_position = ($('#inPaneEditAdminPosSelect').val() === 'custom')
      ? ($('#inPaneEditAdminPositionCustom').val() || null)
      : ($('#inPaneEditAdminPosition').val() || null);
    payload.position_type = $('#inPaneEditPositionType').val();
    payload.job_line = $('#inPaneEditJobLine').val();
    payload.main_group = $('#inPaneEditMainGroup').val() || null;
    payload.department = ($('#inPaneEditDepartmentSelect').val() === 'custom')
      ? ($('#inPaneEditDepartment').val() || null)
      : ($('#inPaneEditDepartmentSelect').val() || $('#inPaneEditDepartment').val() || null);
    payload.academic_branch = isFacultyJob
      ? (($('#inPaneEditAcademicBranchSelect').val() === 'custom')
        ? ($('#inPaneEditAcademicBranch').val() || null)
        : ($('#inPaneEditAcademicBranchSelect').val() || null))
      : null;

function formatDateTh(dateStr) {
  if (!dateStr) return '-';
  try {
    const d = new Date(dateStr);
    if (isNaN(d.getTime())) return dateStr;
    const months = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
    return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear() + 543}`;
  } catch(e) {
    return dateStr;
  }
}

function formatCurrency(amount) {
  const num = parseFloat(amount) || 0;
  return '฿' + num.toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

let currentSalaryPin = 0;

function openSalaryModal(pin) {
  const curRole = (window.currentUserRole || 'guest').toLowerCase();
  const isAdmin = (curRole === 'super_admin' || curRole === 'hr_admin');
  const isExecutive = (curRole === 'executive');
  const curPin = String(window.currentUserPin || '');
  const isSelf = (Boolean(curPin) && String(pin) === curPin);

  // จำกัดสิทธิ์เฉพาะเจ้าหน้าที่ HR, ผู้บริหาร หรือเจ้าของข้อมูลเท่านั้น
  if (!isAdmin && !isExecutive && !isSelf) {
    Swal.fire({
      icon: 'error',

      text: 'ข้อมูลเงินเดือนและค่าตอบแทน ก.พ.7 เป็นข้อมูลควบคุมเฉพาะบุคคลและเจ้าหน้าที่ HR เท่านั้นค่ะ',

  $('#salaryHistoryTableBody').html('<tr><td colspan="10" class="text-center py-4 text-muted"><i class="fa-solid fa-spinner fa-spin me-2 text-primary"></i>กำลังโหลดข้อมูลประวัติเงินเดือน...</td></tr>');
  
  // ค้นหาชื่อจาก currentPersonnelList ถ้ามี

  }

  $('#salaryHistoryModal').modal('show');

  google.script.run
    .withSuccessHandler(function(res) {
      if (res && res.status === 'success') {
        const d = res.data || {};
        const sum = d.summary || {};
        currentSalaryRecords = d.records || [];

        // แสดงผล Dashboard
        $('#sumCurrentSalary').text(formatCurrency(sum.current_salary));
        $('#sumPositionAllowance').text(formatCurrency(sum.position_allowance));

function renderSalaryHistoryTable(records) {
  const $tbody = $('#salaryHistoryTableBody');
  $tbody.empty();

  if (!records || records.length === 0) {
    $tbody.html('<tr><td colspan="10" class="text-center py-4 text-muted">ยังไม่มีบันทึกประวัติเงินเดือนสำหรับบุคลากรท่านนี้ กดปุ่ม "+ เพิ่มรายการเงินเดือน" เพื่อเริ่มบันทึก</td></tr>');
    return;
  }

  records.forEach((r, idx) => {
    const orderText = r.ref_order_number ? `${r.ref_order_number} ${r.ref_order_date ? '(' + formatDateTh(r.ref_order_date) + ')' : ''}` : '-';
    
    // ป้ายแสดงระดับผลการประเมิน
    const evalBadge = r.eval_score_level ? `<span class="badge bg-info-subtle text-info border rounded-pill px-2 py-0 ms-1"><i class="fa-solid fa-star small me-1"></i>${r.eval_score_level}</span>` : '';
    
    // ป้ายแสดงจำนวนเงินที่ได้เลื่อน / ร้อยละ
    let raiseText = '';
    const raiseVal = parseFloat(r.raise_amount) || 0;
    if (raiseVal > 0) {
      raiseText += `+฿${formatCurrency(raiseVal)}`;
    }
    if (r.percentage_rate) {
      raiseText += `${raiseText ? ' ' : ''}(+${r.percentage_rate}%)`;
    }
    const raiseBadge = raiseText ? `<span class="badge bg-success-subtle text-success border rounded-pill px-2 py-0 ms-1">${raiseText}</span>` : '';
    
    const tr = `
      <tr>
        <td class="text-center text-muted fw-bold">${idx + 1}</td>
        <td><strong class="text-dark">${formatDateTh(r.effective_date)}</strong></td>
        <td>
          <div class="d-flex align-items-center flex-wrap gap-1">
            <span class="badge bg-primary-subtle text-primary border rounded-pill px-2 py-1">${r.movement_type}</span>
            ${evalBadge}
            ${raiseBadge}
          </div>
        </td>
        <td>
          <div class="fw-semibold text-dark">${r.position_title}</div>
          <div class="small text-muted">${r.position_number ? 'เลขที่: ' + r.position_number : '-'}</div>
        </td>
        <td>
          <span class="badge bg-light text-secondary border">${r.position_level || '-'}</span>
          <span class="small text-muted ms-1">${r.position_type || ''}</span>
        </td>
        <td class="text-end fw-bold text-primary">${formatCurrency(r.salary_amount)}</td>
        <td class="text-end text-dark">${formatCurrency(r.position_allowance)}</td>
        <td class="text-end text-dark">${formatCurrency(r.special_remuneration)}</td>
        <td class="text-center small text-muted" title="${r.remark || ''}">${orderText}</td>
        <td class="text-center">
          <div class="btn-group btn-group-sm">
            <button type="button" class="btn btn-outline-warning" onclick="event.stopPropagation(); editSalaryRecordById(${r.id}, event)" title="แก้ไขรายการ">
              <i class="fa-solid fa-pen"></i>
            </button>
            <button type="button" class="btn btn-outline-danger" onclick="event.stopPropagation(); deleteSalaryRecordById(${r.id}, event)" title="ลบรายการ">
              <i class="fa-solid fa-trash-can"></i>
            </button>
          </div>
        </td>
      </tr>
    `;
    $tbody.append(tr);
  });
}

  if (currentSalaryRecords && currentSalaryRecords.length > 0) {

  const staff = currentPersonnelList.find(p => String(p.pin) === String(currentSalaryPin));
  const latestRec = (currentSalaryRecords && currentSalaryRecords.length > 0) ? currentSalaryRecords[0] : null;

  if (latestRec) {
    $('#salPositionTitle').val(latestRec.position_title || '');
    $('#salPositionNumber').val(latestRec.position_number || '');
    $('#salPositionLevel').val(latestRec.position_level || '');
  } else if (staff) {
    $('#salPositionTitle').val(staff.position_title || 'พยาบาลวิชาชีพ');
    $('#salPositionNumber').val(staff.position_number || '');
    $('#salPositionLevel').val('');
  } else {
    $('#salPositionTitle').val($('#inPaneEditPositionTitle').val() || '');
    $('#salPositionNumber').val($('#inPaneEditPositionNumber').val() || '');
    $('#salPositionLevel').val('');
  }

  // อัตราเงินเดือนเริ่มต้นเท่ากับฐานเดิม (ให้กรอก/แก้ไขตัวเลขได้อิสระ ไม่บังคับสูตร)
  $('#salSalaryAmount').val(currentPrevBaseSalary > 0 ? currentPrevBaseSalary.toFixed(2) : '');
  $('#salPositionAllowance').val('0.00');
  $('#salSpecialRemun').val('0.00');
  $('#salRefOrderNo').val('');
  $('#salRemark').val('');

  // กำหนดค่าและรีเซ็ต Dropdown วัน/เดือน/พ.ศ.
  initSalaryDateDropdowns();
  $('#salEffectiveDay').val('01');
  $('#salEffectiveMonth').val('10');
  syncSalEffectiveDateBEtoAD();

  $('#salRefOrderDay').val('');
  $('#salRefOrderMonth').val('');
  $('#salRefOrderYearBE').val('');
  $('#salRefOrderDate').val('');

  // จัดการลำดับ Modal เพื่อป้องกัน Stacked Modal ชนกัน
  const wasHistoryOpen = $('#salaryHistoryModal').hasClass('show');
  if (wasHistoryOpen) {
    $('#salaryHistoryModal').modal('hide');
    $('#editSalaryRecordModal').one('hidden.bs.modal', function() {
      if (!window.isSalaryFormSubmitted && wasHistoryOpen) {
        $('#salaryHistoryModal').modal('show');

      window.isSalaryFormSubmitted = false;
    });
  }

  $('#editSalaryRecordModal').modal('show');
}

function editSalaryRecordById(id, e) {
  if (e) {
    if (typeof e.preventDefault === 'function') e.preventDefault();
    if (typeof e.stopPropagation === 'function') e.stopPropagation();
  }
  const rec = currentSalaryRecords.find(r => r.id == id);
  if (!rec) return;

  initSalaryDateDropdowns();
  $('#salaryFormTitle').text('แก้ไขรายการเงินเดือน ก.พ.7');
  $('#salRecordId').val(rec.id);
  $('#salStaffPin').val(rec.staff_id);

  // หาฐานเงินเดือนเดิมก่อนรายการนี้
  const idx = currentSalaryRecords.findIndex(r => r.id == id);
  if (idx >= 0 && idx + 1 < currentSalaryRecords.length) {
    currentPrevBaseSalary = parseFloat(currentSalaryRecords[idx + 1].salary_amount) || 0;
  } else {
    const curSal = parseFloat(rec.salary_amount) || 0;
    const curRaise = parseFloat(rec.raise_amount) || 0;
    currentPrevBaseSalary = (curSal > curRaise && curRaise > 0) ? (curSal - curRaise) : curSal;
  }
  $('#salPrevBaseSalaryLabel').text('฿' + formatCurrency(currentPrevBaseSalary));

  // เติมวันที่มีผลบังคับใช้ (แปลง ค.ศ. -> พ.ศ.)
  if (rec.effective_date) {
    const effRaw = rec.effective_date.split('T')[0];
    $('#salEffectiveDate').val(effRaw);
    const parts = effRaw.split('-');
    if (parts.length === 3) {
      $('#salEffectiveYearBE').val(String(parseInt(parts[0], 10) + 543));
      $('#salEffectiveMonth').val(parts[1]);
      $('#salEffectiveDay').val(parts[2]);
    }
  } else {
    $('#salEffectiveDay').val('');
    $('#salEffectiveMonth').val('');
    $('#salEffectiveYearBE').val('');
    $('#salEffectiveDate').val('');
  }

  // เติมลงวันที่คำสั่ง (แปลง ค.ศ. -> พ.ศ.)
  if (rec.ref_order_date) {
    const orderRaw = rec.ref_order_date.split('T')[0];
    $('#salRefOrderDate').val(orderRaw);
    const parts = orderRaw.split('-');
    if (parts.length === 3) {
      $('#salRefOrderYearBE').val(String(parseInt(parts[0], 10) + 543));
      $('#salRefOrderMonth').val(parts[1]);
      $('#salRefOrderDay').val(parts[2]);
    }
  } else {
    $('#salRefOrderDay').val('');
    $('#salRefOrderMonth').val('');
    $('#salRefOrderYearBE').val('');
    $('#salRefOrderDate').val('');
  }

  $('#salMovementType').val(rec.movement_type);
  $('#salEvalScoreLevel').val(rec.eval_score_level || '');
  $('#salBaseSalary').val(rec.base_salary ? parseFloat(rec.base_salary).toFixed(2) : (currentPrevBaseSalary > 0 ? currentPrevBaseSalary.toFixed(2) : ''));
  $('#salPercentageRate').val(rec.percentage_rate || '');
  $('#salRaiseAmount').val(parseFloat(rec.raise_amount) > 0 ? parseFloat(rec.raise_amount).toFixed(2) : '');
  
  const isCapped = (parseFloat(rec.special_remuneration) > 0 && parseFloat(rec.raise_amount) > 0 && Math.abs(parseFloat(rec.salary_amount) - currentPrevBaseSalary) < 0.01);
  $('#salIsCappedMax').prop('checked', isCapped);

  $('#salPositionTitle').val(rec.position_title);
  $('#salPositionNumber').val(rec.position_number || '');
  $('#salPositionLevel').val(rec.position_level || '');
  $('#salSalaryAmount').val(rec.salary_amount);
  $('#salPositionAllowance').val(rec.position_allowance);
  $('#salSpecialRemun').val(rec.special_remuneration);
  $('#salRefOrderNo').val(rec.ref_order_number || '');
  $('#salRemark').val(rec.remark || '');

  // จัดการลำดับ Modal เพื่อป้องกัน Stacked Modal ชนกัน
  const wasHistoryOpen = $('#salaryHistoryModal').hasClass('show');
  if (wasHistoryOpen) {
    $('#salaryHistoryModal').modal('hide');
    $('#editSalaryRecordModal').one('hidden.bs.modal', function() {
      if (!window.isSalaryFormSubmitted && wasHistoryOpen) {
        $('#salaryHistoryModal').modal('show');
      }
      window.isSalaryFormSubmitted = false;
    });
  }

  $('#editSalaryRecordModal').modal('show');
}

function calculatePeriodDuration(startDateStr, endDateStr) {
  if (!startDateStr) return '';
  const dStart = new Date(startDateStr);
  const dEnd = endDateStr ? new Date(endDateStr) : new Date();
  if (isNaN(dStart.getTime()) || isNaN(dEnd.getTime())) return '';
  
  let years = dEnd.getFullYear() - dStart.getFullYear();
  let months = dEnd.getMonth() - dStart.getMonth();
  let days = dEnd.getDate() - dStart.getDate();
  
  if (days < 0) {
    months -= 1;
    const prevMonthLastDay = new Date(dEnd.getFullYear(), dEnd.getMonth(), 0).getDate();
    days += prevMonthLastDay;
  }
  if (months < 0) {
    years -= 1;
    months += 12;
  }
  
  const parts = [];
  if (years > 0) parts.push(years + ' ปี');
  if (months > 0) parts.push(months + ' เดือน');
  if (parts.length === 0) parts.push((days > 0 ? days : 1) + ' วัน');
  return parts.join(' ');
}

function editServiceRecordById(id, e) {
  if (e) {
    if (typeof e.preventDefault === 'function') e.preventDefault();
    if (typeof e.stopPropagation === 'function') e.stopPropagation();
  }
  const rec = (currentServiceRecords || []).find(r => r.id == id);
  if (!rec) return;

  initServiceDateDropdowns();
  $('#serviceFormTitle').text('แก้ไขช่วงประวัติการทำงาน / รับราชการ');
  $('#serviceRecordId').val(rec.id);
  $('#serviceStaffPin').val(rec.staff_id);

  $('#serviceEmploymentType').val(rec.employment_type || 'ข้าราชการ');
  const isCur = (rec.is_current == 1);
  $('#serviceIsCurrent').prop('checked', isCur);
  onServiceCurrentToggle(isCur);

  $('#servicePositionTitle').val(rec.position_title || '');
  $('#servicePositionLevel').val(rec.position_level || '');
  $('#serviceDepartment').val(rec.department || '');

  // วันที่เริ่มต้น
  if (rec.start_date) {
    const sRaw = rec.start_date.split('T')[0];
    $('#serviceStartDate').val(sRaw);
    const parts = sRaw.split('-');
    if (parts.length === 3) {
      $('#serviceStartYearBE').val(String(parseInt(parts[0], 10) + 543));
      $('#serviceStartMonth').val(parts[1]);
      $('#serviceStartDay').val(parts[2]);
    }
  } else {
    $('#serviceStartDay').val('');
    $('#serviceStartMonth').val('');
    $('#serviceStartYearBE').val('');
    $('#serviceStartDate').val('');
  }

  // วันที่สิ้นสุด
  if (rec.end_date && !isCur) {
    const eRaw = rec.end_date.split('T')[0];
    $('#serviceEndDate').val(eRaw);
    const parts = eRaw.split('-');
    if (parts.length === 3) {
      $('#serviceEndYearBE').val(String(parseInt(parts[0], 10) + 543));
      $('#serviceEndMonth').val(parts[1]);
      $('#serviceEndDay').val(parts[2]);
    }
  } else {
    $('#serviceEndDay').val('');
    $('#serviceEndMonth').val('');
    $('#serviceEndYearBE').val('');
    $('#serviceEndDate').val('');
  }

  // คำสั่ง
  $('#serviceOrderNumber').val(rec.order_number || '');
  if (rec.order_date) {
    const oRaw = rec.order_date.split('T')[0];
    $('#serviceOrderDate').val(oRaw);
    const parts = oRaw.split('-');
    if (parts.length === 3) {
      $('#serviceOrderYearBE').val(String(parseInt(parts[0], 10) + 543));
      $('#serviceOrderMonth').val(parts[1]);
      $('#serviceOrderDay').val(parts[2]);
    }
  } else {
    $('#serviceOrderDay').val('');
    $('#serviceOrderMonth').val('');
    $('#serviceOrderYearBE').val('');
    $('#serviceOrderDate').val('');
  }

  $('#serviceSalaryStart').val(rec.salary_start || '');
  $('#serviceRemarks').val(rec.remarks || '');

  $('#editServiceHistoryModal').modal('show');
}

function submitServiceRecordForm() {
  const pin = $('#serviceStaffPin').val();
  const posTitle = $('#servicePositionTitle').val();
  const startDate = $('#serviceStartDate').val();

  if (!posTitle || !startDate) {
    Swal.fire('ข้อมูลไม่ครบถ้วน', 'กรุณาระบุตำแหน่งและวันที่เริ่มต้นช่วงนี้ (พ.ศ.)', 'warning');
    return;
  }

  const payload = {
    id: $('#serviceRecordId').val() || null,
    staff_id: pin,
    pin: pin,
    employment_type: $('#serviceEmploymentType').val(),
    is_current: $('#serviceIsCurrent').is(':checked') ? 1 : 0,
    position_title: posTitle,
    position_level: $('#servicePositionLevel').val() || null,
    department: $('#serviceDepartment').val() || null,
    start_date: startDate,
    end_date: $('#serviceIsCurrent').is(':checked') ? null : ($('#serviceEndDate').val() || null),
    order_number: $('#serviceOrderNumber').val() || null,
    order_date: $('#serviceOrderDate').val() || null,
    salary_start: $('#serviceSalaryStart').val() ? parseFloat($('#serviceSalaryStart').val()) : null,
    remarks: $('#serviceRemarks').val() || null
  };

  showPpmsLoading('กำลังบันทึกช่วงประวัติการทำงาน...', 'ระบบกำลังบันทึกและคำนวณอายุงานให้อัตโนมัติ');

  google.script.run
    .withSuccessHandler(function(res) {
      hidePpmsLoading();
      if (res && res.status === 'success') {
        Swal.fire('สำเร็จ', res.message, 'success');
        $('#editServiceHistoryModal').modal('hide');
        loadInPaneServiceHistory(pin);
        // รีเฟรชข้อมูลโปรไฟล์หลักและเปิดคงไว้ที่แท็บ 3 (ประวัติรับราชการ & ก.พ.7)

          openPersonnelEditInPane(pin, '#editpane-tab-civil');
        }
      } else {
        Swal.fire('ข้อผิดพลาด', res ? res.message : 'ไม่สามารถบันทึกข้อมูลได้', 'error');
      }
    })
    .withFailureHandler(function(err) {
      hidePpmsLoading();
      Swal.fire('การเชื่อมต่อขัดข้อง', err.message, 'error');
    })

    $('#btnAdminAddSalary').removeClass('d-none');

    $('.salary-admin-col').removeClass('d-none');
  } else {
    $('#btnAdminAddSalary').addClass('d-none');
    $('#badgeStaffSalaryNotice').removeClass('d-none');
    $('.salary-admin-col').addClass('d-none');
  }

  const $tbody = $('#inPaneSalaryTableBody');
  $tbody.empty();
  const colspan = isAdmin ? 9 : 8;

  if (!records || records.length === 0) {
    const emptyMsg = isAdmin 
      ? 'ยังไม่มีประวัติการดำรงตำแหน่งและเงินเดือนในระบบ กดปุ่ม "+ เพิ่มรายการ ก.พ.7" ด้านบนเพื่อเริ่มบันทึก'

  records.forEach((r, idx) => {
    const orderText = r.ref_order_number ? `${r.ref_order_number} ${r.ref_order_date ? '(' + formatDateTh(r.ref_order_date) + ')' : ''}` : '-';
    
    // ป้ายแสดงระดับผลการประเมิน

        <td><strong class="text-dark">${formatDateTh(r.effective_date)}</strong></td>

            ${evalBadge}
