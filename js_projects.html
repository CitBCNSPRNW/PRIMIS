let currentEducationRecords = [];

function initEducationDateDropdowns() {
  const $ySelect = $('#eduGradYearBE');
  if ($ySelect.children('option').length <= 1) {
    const currentYearBE = new Date().getFullYear() + 543;
    for (let y = currentYearBE + 2; y >= currentYearBE - 60; y--) {
      $ySelect.append($('<option>', { value: y, text: y }));
    }
  }
}

/**
 * เติมรายชื่อบุคลากรลงใน Dropdown ค้นหาหน้าหลัก (สำหรับ Admin / HR เท่านั้น)
 */
function populateEducationStaffFilter(selectedPin) {
  const $sel = $('#eduFilterStaffSelect');
  const curRole = (window.currentUserRole || 'guest').toLowerCase();
  const isAdmin = (curRole === 'super_admin' || curRole === 'hr_admin');

  $sel.empty();

  if (isAdmin) {
    $('#eduFilterControlsBar').removeClass('d-none');
    ensurePersonnelListLoaded(function(list) {
      const rawList = (list && list.length > 0) ? list : (window.allPersonnelList || []);
      const staffList = rawList.filter(isStaffActiveOrStudying);
      $sel.empty();
      $sel.append(`<option value="all">-- แสดงประวัติการศึกษาของบุคลากรที่ปฏิบัติงาน (${staffList.length} คน) --</option>`);
      staffList.forEach(p => {
        const pin = p.pin || p.id || p.user_pin;
        const name = `${p.title_th || ''}${p.fname_th || p.first_name_th || ''} ${p.lname_th || p.last_name_th || ''}`.trim() || p.name;
        const pos = (p.position || p.position_title || '').trim();
        const posText = pos ? ` (${pos})` : '';
        $sel.append(`<option value="${pin}" data-pin="${pin}">#${pin} - ${name}${posText}</option>`);
      });
      $sel.prop('disabled', false);
      $sel.val(selectedPin && selectedPin !== 0 ? String(selectedPin) : 'all');
      if ($.fn.select2) {
        if ($sel.data('select2')) {
          $sel.select2('destroy');
        }
        $sel.select2({
          theme: 'bootstrap-5',
          width: '100%',
          matcher: select2MatcherWithPin
        });
      }
    });
  } else {
    // เจ้าของข้อมูล (Staff): ซ่อนแถบ Dropdown ออกทั้งหมดเด็ดขาด
    $('#eduFilterControlsBar').addClass('d-none');
    $sel.prop('disabled', true);
  }
}

/**
 * ตรวจสอบและแสดงแจ้งเตือนสำหรับ HR ว่าบุคลากรท่านใดที่ยังมีประวัติการศึกษาแต่ยังไม่ได้กำหนดวุฒิสูงสุด
 */
function checkMissingHighestEducation() {
  const curRole = (window.currentUserRole || 'guest').toLowerCase();
  const isAdmin = (curRole === 'super_admin' || curRole === 'hr_admin' || curRole === 'admin');
  if (!isAdmin) {
    $('#eduMissingHighestAlertBanner').addClass('d-none');
    return;
  }

  const records = currentEducationRecords || [];
  if (records.length === 0) {
    $('#eduMissingHighestAlertBanner').addClass('d-none');
    return;
  }

  // จัดกลุ่มบุคลากรเพื่อหาท่านที่ไม่มีวุฒิสูงสุด
  const staffEduMap = {};
  records.forEach(r => {
    const pin = String(r.staff_id);
    if (!staffEduMap[pin]) staffEduMap[pin] = [];
    staffEduMap[pin].push(r);
  });

  const missingList = [];
  for (const pin in staffEduMap) {
    const hasHighest = staffEduMap[pin].some(r => r.is_highest == 1);
    if (!hasHighest) {
      const firstRec = staffEduMap[pin][0];
      const name = firstRec.fname_th ? `${firstRec.title_th || ''}${firstRec.fname_th} ${firstRec.lname_th || ''}`.trim() : `PIN #${pin}`;
      missingList.push({ pin: pin, name: name });
    }
  }

  if (missingList.length > 0) {
    $('#eduMissingHighestCount').text(missingList.length);
    const namesPreview = missingList.slice(0, 5).map(m => `<b>${m.name}</b>`).join(', ') + (missingList.length > 5 ? ` และอีก ${missingList.length - 5} ท่าน` : '');
    $('#eduMissingHighestNames').html(`บุคลากรที่ยังไม่มีวุฒิสูงสุด: ${namesPreview}`);
    $('#eduMissingHighestAlertBanner').removeClass('d-none').addClass('d-flex');
  } else {
    $('#eduMissingHighestAlertBanner').addClass('d-none');
  }
}

/**
 * ฟังก์ชันสำหรับปุ่มลัดใน Alert Banner กรองดูเฉพาะบุคลากรที่ยังไม่ได้กำหนดวุฒิสูงสุด
 */
function filterMissingHighestDegrees() {
  const staffWithHighest = new Set((currentEducationRecords || []).filter(r => r.is_highest == 1).map(r => String(r.staff_id)));
  const filtered = (currentEducationRecords || []).filter(r => !staffWithHighest.has(String(r.staff_id)));
  renderEducationTable(filtered);
}

function filterEducationTableByStaff() {
  const curRole = (window.currentUserRole || 'guest').toLowerCase();
  const isAdmin = (curRole === 'super_admin' || curRole === 'hr_admin' || curRole === 'admin');
  const myPin = String(window.currentUserPin || '');

  let filtered = currentEducationRecords || [];
  if (isAdmin) {
    const staffPin = $('#eduFilterStaffSelect').val();
    if (staffPin && staffPin !== 'all') {
      filtered = filtered.filter(r => String(r.staff_id) === String(staffPin));
    }
  } else {
    if (myPin) {
      filtered = filtered.filter(r => String(r.staff_id) === myPin);
    }
  }
  
  renderEducationTable(filtered);
}

    return;
  }

  // เรียงลำดับ: วุฒิสูงสุด อยู่บนสุดเสมอ -> ปีที่สำเร็จการศึกษาล่าสุดขึ้นมาก่อน (DESC)
  const sortedRecords = [...records].sort((a, b) => {
    const staffA = String(a.staff_id || '');
    const staffB = String(b.staff_id || '');
    if (staffA !== staffB && $('#eduFilterStaffSelect').val() === 'all') {
      return staffA.localeCompare(staffB);
    }
    // 1. วุฒิสูงสุด อยู่บนสุดเสมอ (is_highest == 1 ขึ้นก่อน)
    const aHigh = (a.is_highest == 1) ? 1 : 0;
    const bHigh = (b.is_highest == 1) ? 1 : 0;
    if (aHigh !== bHigh) {
      return bHigh - aHigh;
    }
    // 2. ปีที่สำเร็จการศึกษาล่าสุดขึ้นมาก่อน (ปีมากไปน้อย DESC)
    const aYear = parseInt(a.grad_year, 10) || 0;
    const bYear = parseInt(b.grad_year, 10) || 0;
    if (aYear !== bYear) {
      return bYear - aYear;
    }
    return (b.id || 0) - (a.id || 0);
  });

  sortedRecords.forEach((r, idx) => {
    const isHighestBadge = r.is_highest == 1 
      ? '<span class="badge bg-success-subtle text-success border border-success-subtle rounded-pill px-2 py-0.5 small fw-bold edu-nowrap"><i class="fa-solid fa-check me-1"></i>วุฒิสูงสุด</span>' 
      : '<span class="text-muted small">-</span>';
    
    // ระดับการศึกษา: ใส่สีเด่นเฉพาะ วุฒิการศึกษาสูงสุด เท่านั้น
    const levelBadge = (r.is_highest == 1)
      ? `<span class="badge bg-primary-subtle text-primary border border-primary-subtle rounded-pill px-2.5 py-0.5 fw-bold edu-nowrap"><i class="fa-solid fa-award text-primary me-1"></i>${escapeHtml(r.edu_level)}</span>`
      : `<span class="text-secondary small fw-normal edu-nowrap">${escapeHtml(r.edu_level)}</span>`;

    // Avatar and name (กระชับความสูง ไม่ดันแถว)
    const staffName = r.fname_th ? `${r.title_th || ''}${r.fname_th} ${r.lname_th || ''}` : `บุคลากร PIN #${r.staff_id}`;
    const staffPhoto = (typeof formatStaffPhotoUrl === 'function' ? formatStaffPhotoUrl(r.photo_url) : r.photo_url) || (typeof DEFAULT_STAFF_AVATAR !== 'undefined' ? DEFAULT_STAFF_AVATAR : '');
    const staffCol = `
      <div class="d-flex align-items-center gap-2" style="line-height: 1.2;">
        <img src="${staffPhoto}" class="rounded-circle border shadow-xs" style="width: 28px; height: 28px; min-width: 28px; object-fit: cover;" onerror="this.onerror=null;this.src=(typeof DEFAULT_STAFF_AVATAR !== 'undefined' ? DEFAULT_STAFF_AVATAR : '')">
        <div>
          <div class="fw-bold text-dark edu-nowrap" style="font-size: 0.835rem;">${staffName}</div>
          <span class="badge bg-light text-primary border rounded-pill" style="font-size: 0.65rem; padding: 0.5px 5px;">#${r.staff_id}</span>
        </div>
      </div>
    `;

    const isOwner = (Boolean(myPin) && String(r.staff_id) === myPin);

    let actionButtons = '';
    if (isAdmin) {
      actionButtons = `
        <div class="btn-group btn-group-sm">
          <button class="btn btn-outline-warning btn-sm py-0.5 px-2" onclick="editEducationRecordById(${r.id})" title="แก้ไขรายการ">
            <i class="fa-solid fa-pen-to-square"></i>
          </button>
          <button class="btn btn-outline-danger btn-sm py-0.5 px-2" onclick="deleteEducationRecordById(${r.id}, ${r.staff_id})" title="ลบรายการ">
            <i class="fa-solid fa-trash"></i>
          </button>
        </div>
      `;
    } else if (isOwner) {
      actionButtons = `
        <button class="btn btn-outline-warning btn-sm py-0.5 px-2.5 rounded-pill shadow-2xs" onclick="editEducationRecordById(${r.id})" title="แก้ไขข้อมูล/แนบหลักฐาน">
          <i class="fa-solid fa-pen-to-square me-1"></i>แก้ไข
        </button>
      `;
    } else {
      actionButtons = `<span class="badge bg-light text-muted border px-1.5 py-0.5 small edu-nowrap">ดูได้อย่างเดียว</span>`;
    }

    // วุฒิการศึกษา + วุฒิย่อ + เอกสารแนบ อยู่ในบรรทัดเดียวกันอย่างสวยงาม ไม่ตกบรรทัด
    const docBadge = r.doc_url 
      ? `<a href="${escapeHtml(r.doc_url)}" target="_blank" class="badge bg-danger-subtle text-danger border border-danger-subtle text-decoration-none px-1.5 py-0.5 shadow-2xs ms-1" style="font-size:0.68rem;" title="เปิดดูเอกสารหลักฐาน"><i class="fa-solid fa-file-pdf me-0.5"></i>แนบไฟล์</a>` 
      : '';
    const degreeContent = `
      <div class="d-inline-flex align-items-center flex-wrap gap-1" style="line-height: 1.25;">
        <span class="fw-semibold text-dark" style="font-size: 0.835rem;">${escapeHtml(r.degree_name)}</span>
        ${r.degree_short ? `<span class="text-secondary small fw-normal">(${escapeHtml(r.degree_short)})</span>` : ''}
        ${docBadge}
      </div>
    `;

    const tr = `
      <tr>
        <td class="text-center text-muted fw-bold ps-3 edu-nowrap">${idx + 1}</td>
        <td>${staffCol}</td>
        <td class="edu-nowrap">${levelBadge}</td>
        <td class="edu-degree-cell">${degreeContent}</td>
        <td><div class="text-dark small text-truncate" style="max-width: 130px;" title="${escapeHtml(r.major || '')}">${escapeHtml(r.major || '-')}</div></td>
        <td><div class="text-secondary small text-truncate" style="max-width: 140px;" title="${escapeHtml(r.institution || '')}">${escapeHtml(r.institution || '-')}</div></td>
        <td class="text-center fw-bold text-dark edu-nowrap small">${r.grad_year ? r.grad_year : '-'}</td>
        <td class="text-center edu-nowrap"><span class="badge bg-light text-secondary border px-1.5 py-0.5 small">${escapeHtml(r.country || 'ไทย')}</span></td>
        <td class="text-center edu-nowrap">${isHighestBadge}</td>
        <td class="text-center pe-3 edu-nowrap">
          ${actionButtons}
        </td>
      </tr>
    `;
    $tbody.append(tr);
  });
}

/**
 * เติมรายชื่อบุคลากรลงใน Dropdown ของ Modal บันทึกวุฒิการศึกษา
 */
function populateEducationModalStaffSelect(selectedPin) {
  const $sel = $('#eduModalStaffSelect');
  $sel.empty();
  $sel.append('<option value="">-- กรุณาค้นหาและเลือกบุคลากร --</option>');

  ensurePersonnelListLoaded(function(list) {
    const rawList = (list && list.length > 0) ? list : (window.allPersonnelList || []);
    const staffList = rawList.filter(isStaffActiveOrStudying);
    staffList.forEach(p => {
      const pin = p.pin || p.id || p.user_pin;
      const name = `${p.title_th || ''}${p.fname_th || p.first_name_th || ''} ${p.lname_th || p.last_name_th || ''}`.trim() || p.name;
      const pos = (p.position || p.position_title || '').trim();
      const posText = pos ? ` (${pos})` : '';
      $sel.append(`<option value="${pin}" data-pin="${pin}">#${pin} - ${name}${posText}</option>`);
    });
    if (selectedPin) {
      $sel.val(String(selectedPin));
    }
    if ($.fn.select2) {
      if ($sel.data('select2')) {
        $sel.select2('destroy');
      }
      $sel.select2({
        theme: 'bootstrap-5',
        dropdownParent: $('#editEducationModal'),
        width: '100%',
        matcher: select2MatcherWithPin
      });
    }
    $sel.off('change').on('change', function() {
      onEduModalStaffChanged($(this).val());
    });
  });
}

  $('#eduStaffNameLabel').text(sName);
}

function editEducationRecordById(id) {
  const curRole = (window.currentUserRole || 'guest').toLowerCase();
  const isAdmin = (curRole === 'super_admin' || curRole === 'hr_admin');
  const myPin = String(window.currentUserPin || '');

  initEducationDateDropdowns();
  const rec = (currentEducationRecords || []).find(r => r.id == id);
  if (!rec) return;

  if (!isAdmin && String(rec.staff_id) !== myPin) {
    Swal.fire('สิทธิ์ไม่เพียงพอ', 'ท่านสามารถแก้ไขได้เฉพาะข้อมูลประวัติการศึกษาของตนเองเท่านั้น', 'error');
    return;
  }

  $('#educationFormTitle').text('แก้ไขข้อมูลประวัติการศึกษา');
  $('#eduRecordId').val(rec.id);
  $('#eduStaffPin').val(rec.staff_id);
  $('#eduStaffPinBadge').text('#' + rec.staff_id);

  const list = window.allPersonnelList || (typeof currentPersonnelList !== 'undefined' ? currentPersonnelList : []);
  const staff = list.find(p => String(p.pin || p.id || p.user_pin) === String(rec.staff_id));
  const sName = staff ? `${staff.title_th || ''}${staff.fname_th || staff.first_name_th || ''} ${staff.lname_th || staff.last_name_th || ''}`.trim() : (rec.fname_th ? `${rec.title_th || ''}${rec.fname_th} ${rec.lname_th || ''}` : `บุคลากร PIN #${rec.staff_id}`);
  $('#eduStaffNameLabel').text(sName);

  // กรณีแก้ไข: ซ่อนกล่องเลือกบุคลากร และแสดงกล่องข้อมูล Fixed เพื่อป้องกันเปลี่ยนเจ้าของเรคคอร์ด
  $('#eduStaffSelectBox').addClass('d-none');
  $('#eduStaffFixedBox').removeClass('d-none');

  $('#eduLevel').val(rec.edu_level);
  $('#eduGradYearBE').val(rec.grad_year || '');
  $('#eduDegreeName').val(rec.degree_name);
  $('#eduDegreeShort').val(rec.degree_short || '');
  $('#eduMajor').val(rec.major);
  $('#eduInstitution').val(rec.institution);
  $('#eduCountry').val(rec.country || 'ไทย');
  $('#eduIsHighest').prop('checked', rec.is_highest == 1);

  // ตั้งค่าไฟล์เอกสารเดิม (ถ้ามี)
  $('#eduFileInput').val('');
  window.selectedEduFileObject = null;
  if (rec.doc_url && rec.doc_url.trim()) {
    $('#eduDocUrl').val(rec.doc_url.trim());
    $('#eduFileNameText').text(rec.doc_url.split('/').pop() || 'เอกสารหลักฐานวุฒิการศึกษา');
    $('#btnViewEduDocLink').removeClass('d-none').attr('href', rec.doc_url.trim());
    $('#eduFilePreviewBox').removeClass('d-none');
  } else {
    $('#eduDocUrl').val('');
    $('#eduFilePreviewBox').addClass('d-none');
    $('#btnViewEduDocLink').addClass('d-none').attr('href', 'javascript:void(0)');
  }
  $('#eduDocUrlManualBox').addClass('d-none');

  $('#editEducationModal').modal('show');
}

function submitEducationRecordForm() {
  const curRole = (window.currentUserRole || 'guest').toLowerCase();
  const isAdmin = (curRole === 'super_admin' || curRole === 'hr_admin');
  const myPin = String(window.currentUserPin || '');
  const pin = $('#eduStaffPin').val();

  if (!isAdmin && String(pin) !== myPin) {
    Swal.fire('สิทธิ์ไม่เพียงพอ', 'ท่านสามารถบันทึกหรือแก้ไขได้เฉพาะข้อมูลของตนเองเท่านั้น', 'error');
    return;
  }

  const eduLevel = $('#eduLevel').val();
  const degreeName = $('#eduDegreeName').val();
  const gradYear = $('#eduGradYearBE').val();

  if (!pin || parseInt(pin, 10) <= 0) {
    Swal.fire('ข้อมูลไม่ครบถ้วน', 'กรุณาระบุหรือเลือกบุคลากรผู้สำเร็จการศึกษา', 'warning');
    return;
  }

  if (!eduLevel || !degreeName) {
    Swal.fire('ข้อมูลไม่ครบถ้วน', 'กรุณาระบุระดับการศึกษาและชื่อวุฒิการศึกษา', 'warning');
    return;
  }

  const executeSave = function(docUrlToSave) {
    const payload = {
      id: $('#eduRecordId').val() || null,
      staff_id: parseInt(pin),
      pin: parseInt(pin),
      operator_role: curRole,
      operator_pin: parseInt(myPin) || 0,
      edu_level: eduLevel,
      grad_year: gradYear ? parseInt(gradYear) : null,
      degree_name: degreeName.trim(),
      degree_short: $('#eduDegreeShort').val() ? $('#eduDegreeShort').val().trim() : null,
      major: $('#eduMajor').val() ? $('#eduMajor').val().trim() : '',
      institution: $('#eduInstitution').val() ? $('#eduInstitution').val().trim() : 'สถาบันการศึกษาตามหลักฐาน',
      country: $('#eduCountry').val() ? $('#eduCountry').val().trim() : 'ไทย',
      is_highest: $('#eduIsHighest').is(':checked') ? 1 : 0,
      doc_url: docUrlToSave || null
    };

    showPpmsLoading('กำลังบันทึกข้อมูลการศึกษา...', 'ระบบกำลังบันทึกข้อมูลและเชื่อมโยงหลักฐานวุฒิการศึกษา');
    google.script.run
      .withSuccessHandler(function(res) {
        hidePpmsLoading();
        if (res && (res.status === 'success' || res.success)) {
          Swal.fire({
            icon: 'success',
            title: 'สำเร็จ',
            text: res.message || 'บันทึกข้อมูลประวัติการศึกษาเรียบร้อยแล้ว',
            timer: 1500,
            showConfirmButton: false
          });
          $('#editEducationModal').modal('hide');
          loadEducationRecords();
          if (typeof window.currentViewingPin !== 'undefined' && window.currentViewingPin) {
            if (typeof openPersonnelInPaneDetail === 'function') {
              openPersonnelInPaneDetail(window.currentViewingPin);
            }
          }
        } else {
          Swal.fire('ข้อผิดพลาด', res ? res.message : 'ไม่สามารถบันทึกข้อมูลได้', 'error');
        }
      })
      .withFailureHandler(function(err) {
        hidePpmsLoading();
        Swal.fire('การเชื่อมต่อขัดข้อง', err ? err.toString() : 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้', 'error');
      })
      .saveEducationRecord(payload);
  };

  // ถ้ามีการเลือกไฟล์ใหม่จากเครื่อง ให้แปลง Base64 แล้วส่งขึ้น Ubuntu Server ก่อน
  if (window.selectedEduFileObject) {
    showPpmsLoading('กำลังอัปโหลดไฟล์วุฒิการศึกษา...', 'กำลังส่งไฟล์เอกสารไปยังเซิร์ฟเวอร์ Ubuntu');
    const reader = new FileReader();
    reader.onload = function(e) {
      const uploadPayload = {
        pin: parseInt(pin),
        user_pin: String(pin),
        folder_type: 'education',
        original_name: window.selectedEduFileObject.name,
        base64_data: e.target.result
      };

      google.script.run
        .withSuccessHandler(function(uploadRes) {
          if (uploadRes && (uploadRes.status === 'success' || uploadRes.success) && uploadRes.file_url) {
            window.selectedEduFileObject = null;
            $('#eduDocUrl').val(uploadRes.file_url);
            executeSave(uploadRes.file_url);
          } else {
            hidePpmsLoading();
            Swal.fire({
              icon: 'error',
              title: 'อัปโหลดไฟล์ไม่สำเร็จ',
              text: (uploadRes && uploadRes.message) ? uploadRes.message : 'เกิดข้อผิดพลาดในการจัดเก็บไฟล์บนเซิร์ฟเวอร์'
            });
          }
        })
        .withFailureHandler(function(err) {
          hidePpmsLoading();
          Swal.fire('อัปโหลดไฟล์ล้มเหลว', err ? err.toString() : 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้', 'error');
        })
        .uploadServerFile(uploadPayload);
    };
    reader.onerror = function() {
      hidePpmsLoading();
      Swal.fire('ข้อผิดพลาด', 'ไม่สามารถอ่านไฟล์ที่เลือกได้ กรุณาลองใหม่อีกครั้ง', 'error');
    };
    reader.readAsDataURL(window.selectedEduFileObject);
  } else {
    // ใช้ค่าจากช่อง URL เดิม (ถ้ามี)
    const existingDocUrl = $('#eduDocUrl').val().trim();
    executeSave(existingDocUrl);
  }
}

/**
 * Event เมื่อผู้ใช้เลือกไฟล์วุฒิการศึกษาจากเครื่อง
 */
function onEduFileSelected(input) {
  const file = input.files && input.files[0];
  if (!file) return;

  // ตรวจสอบขนาดไฟล์ไม่เกิน 10MB
  const maxBytes = 10 * 1024 * 1024;
  if (file.size > maxBytes) {
    Swal.fire({
      icon: 'warning',
      title: 'ไฟล์มีขนาดใหญ่เกินไป',
      text: 'กรุณาเลือกไฟล์เอกสารที่มีขนาดไม่เกิน 10MB ค่ะ (ไฟล์ปัจจุบันขนาด ' + (file.size / (1024 * 1024)).toFixed(1) + 'MB)'
    });
    input.value = '';
    return;
  }

  window.selectedEduFileObject = file;
  $('#eduFileNameText').text(file.name + ' (' + (file.size / 1024).toFixed(0) + ' KB)');
  $('#btnViewEduDocLink').addClass('d-none');
  $('#eduFilePreviewBox').removeClass('d-none');
}

/**
 * ล้างไฟล์ที่เลือก
 */
function clearEduFileInput() {
  $('#eduFileInput').val('');
  window.selectedEduFileObject = null;
  const existingUrl = $('#eduDocUrl').val().trim();
  if (existingUrl) {
    $('#eduFileNameText').text(existingUrl.split('/').pop() || 'เอกสารเดิม');
    $('#btnViewEduDocLink').removeClass('d-none').attr('href', existingUrl);
  } else {
    $('#eduFilePreviewBox').addClass('d-none');
  }
}

function deleteEducationRecordById(id, pin) {
  const curRole = (window.currentUserRole || 'guest').toLowerCase();

    cancelButtonColor: '#64748b',

 * =========================================================================
 * โมดูลพิมพ์รายงาน ก.พ.7 ย่อ (KP7 Printable Official Summary Report)
 * อ้างอิงตามเอกสารทางการ: หน้าพิมพ์รายงาน.jpg

 */

/**
 * คำนวณระยะเวลาอย่างละเอียด (ปี เดือน วัน)
 */
function calculateDetailedAgeOrTenure(startDateStr, endDateStr, includeDays = false) {
  if (!startDateStr) return '-';
  try {
    let cleanStart = String(startDateStr).split('T')[0].trim();
    let parts1 = cleanStart.split('-');
    if (parts1.length !== 3) return '-';
    let y1 = parseInt(parts1[0], 10);
    let m1 = parseInt(parts1[1], 10) - 1;
    let d1 = parseInt(parts1[2], 10);
    if (y1 > 2400) y1 -= 543; // แปลง พ.ศ. เป็น ค.ศ.
    const start = new Date(y1, m1, d1);

    let end = new Date();
    if (endDateStr) {
      let cleanEnd = String(endDateStr).split('T')[0].trim();
      let parts2 = cleanEnd.split('-');
      if (parts2.length === 3) {
        let y2 = parseInt(parts2[0], 10);
        let m2 = parseInt(parts2[1], 10) - 1;
        let d2 = parseInt(parts2[2], 10);
        if (y2 > 2400) y2 -= 543;
        end = new Date(y2, m2, d2);
      }
    }

    if (isNaN(start.getTime()) || isNaN(end.getTime()) || start > end) return '-';

    let years = end.getFullYear() - start.getFullYear();
    let months = end.getMonth() - start.getMonth();
    let days = end.getDate() - start.getDate();

    if (days < 0) {
      months--;
      const prevMonthLastDay = new Date(end.getFullYear(), end.getMonth(), 0).getDate();
      days += prevMonthLastDay;
    }
    if (months < 0) {
      years--;
      months += 12;
    }

    const segments = [];
    if (years > 0) segments.push(`${years} ปี`);
    if (months > 0) segments.push(`${months} เดือน`);
    if (includeDays && days > 0) segments.push(`${days} วัน`);

    if (segments.length === 0) {
      return includeDays ? `${days} วัน` : '0 เดือน';
    }

    return segments.join(' ');
  } catch (err) {
    return '-';
  }
}

/**
 * จัดรูปแบบตัวเลขพร้อมคอมม่าคั่นหลักพันและทศนิยม (เช่น 31,450.00)
 */
function formatNumber(amount, decimals = 2) {
  const num = parseFloat(amount) || 0;
  return num.toLocaleString('th-TH', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
}

function formatFullThaiDate(dateStr) {
  if (!dateStr) return '-';
  try {
    let clean = String(dateStr).split('T')[0].trim();
    let parts = clean.split('-');
    if (parts.length !== 3) return dateStr;
    let y = parseInt(parts[0], 10);
    let m = parseInt(parts[1], 10);
    let d = parseInt(parts[2], 10);
    if (y < 2400) y += 543;

    const monthNames = [
      '', 'มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน',
      'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'
    ];
    const monthName = monthNames[m] || '';
    return `${d} ${monthName} พ.ศ. ${y}`;
  } catch (e) {
    return dateStr;
  }
}



function calculateOfficialRetirementDateTh(birthDateStr, isCivilServant = true) {
  if (!birthDateStr) return '-';
  try {
    let clean = String(birthDateStr).split('T')[0].trim();
    let parts = clean.split('-');
    if (parts.length !== 3) return '-';
    let y = parseInt(parts[0], 10);
    let m = parseInt(parts[1], 10);
    let d = parseInt(parts[2], 10);
    if (y < 2400) y += 543;

    let retireYearBE = y + 60;
    if (isCivilServant) {
      
      if (m > 10 || (m === 10 && d >= 2)) {
        retireYearBE += 1;
      }
      return `1 ตุลาคม พ.ศ. ${retireYearBE}`;
    } else {
      
      return `30 กันยายน พ.ศ. ${retireYearBE}`;
    }
  } catch (e) {
    return '-';
  }
}

window.allLicensesCache = [];

/**

/**
 * โหลดข้อมูลใบอนุญาตและบัตรข้าราชการทั้งหมดเข้าสู่ Alert Center
 * @param {number|string} targetPin - PIN บุคลากรที่ต้องการกรองเฉพาะ หรือ 0 สำหรับทั้งหมด
 * @param {boolean} forceRefresh - บังคับดึงข้อมูลใหม่จาก Server
 */
function loadLicenseCenterTable(targetPin = 0, forceRefresh = false) {
  const curRole = (window.currentUserRole || 'guest').toLowerCase();
  const isAdmin = (curRole === 'super_admin' || curRole === 'hr_admin' || curRole === 'admin');
  const myPin = String(window.currentUserPin || '');

  // ควบคุมปุ่มสลับโหมดของแอดมิน และแถบตัวกรอง (user ทั่วไปซ่อนตัวกรองทั้งหมด)
  if (!isAdmin) {
    window.licenseCenterViewMode = 'self';
    $('#btnToggleLicAdminHub').addClass('d-none');
    $('#licFilterControlsBar').addClass('d-none');
  } else {
    $('#btnToggleLicAdminHub').removeClass('d-none');
    if (!window.licenseCenterViewMode) {
      window.licenseCenterViewMode = 'all'; // เริ่มต้นแอดมินดูภาพรวม
    }
    if (window.licenseCenterViewMode === 'self') {
      $('#licHubToggleText').text('ดูภาพรวมทั้งวิทยาลัย');
      $('#btnToggleLicAdminHub').removeClass('btn-primary').addClass('btn-outline-primary');
      $('#licFilterControlsBar').addClass('d-none');
    } else {
      $('#licHubToggleText').text('ดูข้อมูลของตนเอง');
      $('#btnToggleLicAdminHub').removeClass('btn-outline-primary').addClass('btn-primary');
      $('#licFilterControlsBar').removeClass('d-none');
    }
  }

  // คำนวณ PIN ที่ต้องการสืบค้น
  let queryPin = 0;
  if (targetPin !== undefined && targetPin !== null && targetPin !== 0) {
    queryPin = targetPin;
  } else if (window.licenseCenterViewMode === 'self' && myPin) {
    queryPin = parseInt(myPin, 10);
  }

  showPpmsLoading('กำลังโหลดทะเบียนใบอนุญาตและบัตร...', 'ระบบกำลังประมวลผลข้อมูลสถานะวันหมดอายุและสรุปตัวเลขอัจฉริยะ');
  
  google.script.run
    .withSuccessHandler(function(res) {
      Swal.close();
      if (!res || (res.status !== 'success' && !res.success)) {
        Swal.fire({
          icon: 'error',
          title: 'ไม่สามารถโหลดข้อมูลได้',
          text: (res && res.message) ? res.message : 'เกิดข้อผิดพลาดในการเชื่อมต่อเซิร์ฟเวอร์'
        });
        return;
      }

      window.allLicensesCache = res.data || [];
      const summary = res.summary || {};

      // 1. อัปเดต Top Stat Cards
      $('#statLicTotal, #licStatTotal').text((summary.total || window.allLicensesCache.length).toLocaleString());
      $('#statLicValid, #licStatValid').text((summary.valid || 0).toLocaleString());
      $('#statLicExpiring90, #licStatExpiring90').text((summary.expiring_90 || 0).toLocaleString());
      const critExpiredTotal = (summary.critical_30 || 0) + (summary.expired || 0);
      $('#statLicCriticalExpired, #licStatCriticalExpired').text(critExpiredTotal.toLocaleString());

      // 2. เติมรายชื่อบุคลากรใน Dropdown ค้นหา (#licFilterStaffSelect / #licFilterStaff)
      populateLicenseStaffFilter(queryPin);

      // 3. กรองและแสดงผลตาราง
      applyLicenseCenterFilters();
    })
    .withFailureHandler(function(err) {
      Swal.close();
      Swal.fire({
        icon: 'error',
        title: 'เกิดข้อผิดพลาดในการโหลดข้อมูล',
        text: err ? err.toString() : 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้'
      });
    })
    .getLicenseHistory(queryPin, 'all');
}

/**
 * ตรวจสอบสถานะการปฏิบัติงานของบุคลากร
 * คัดกรองบุคลากรที่พ้นสภาพ (เกษียณ, ลาออก, เสียชีวิต, พ้นสภาพ) ออกจาก Dropdown การบันทึกข้อมูล
 * ยกเว้น "ลาศึกษาต่อ" และ "ช่วยราชการ" ที่ยังคงสามารถจัดการข้อมูลได้ตามความต้องการของระบบ
 */
function isStaffActiveOrStudying(staff) {
  if (!staff) return false;
  const status = String(staff.work_status || 'ปกติ/ปฏิบัติงาน/ข้าราชการ/รับโอน').trim().toLowerCase();
  if (
    status.includes('เกษียณ') ||
    status.includes('ลาออก') ||
    status.includes('เสียชีวิต') ||
    status.includes('ตาย') ||
    status.includes('พ้นสภาพ') ||
    status.includes('โอนย้ายไปนอก') ||
    status.includes('โอนย้ายไปใน') ||
    status.includes('ย้ายไปคณะแพทย์') ||
    status.includes('ย้ายข้าราชการออก') ||
    status.includes('โอนข้าราชการไปนอก')
  ) {
    return false;
  }
  return true;
}
window.isStaffActiveOrStudying = isStaffActiveOrStudying;

/**
 * โหลดรายชื่อบุคลากรทั้งหมดเข้าแคชส่วนกลาง มั่นใจว่ามีข้อมูลพร้อมใช้เสมอ
 */
function ensurePersonnelListLoaded(callback) {
  if (window.allPersonnelList && window.allPersonnelList.length > 0) {
    if (typeof callback === 'function') callback(window.allPersonnelList);
    return;
  }
  if (typeof currentPersonnelList !== 'undefined' && currentPersonnelList && currentPersonnelList.length > 0) {
    window.allPersonnelList = currentPersonnelList;
    if (typeof callback === 'function') callback(window.allPersonnelList);
    return;
  }

  google.script.run
    .withSuccessHandler(function(res) {
      if (res && res.status === 'success' && Array.isArray(res.data)) {
        const seen = {};
        const cleaned = res.data.filter(function(p) {
          const pin = String(p.pin || p.user_pin || p.id || '').trim();
          if (pin === '1' || pin === '999999' || p.id === 1 || p.id === 121 || p.id === '1' || p.id === '121') return false;
          const name = ((p.title_th || '') + (p.fname_th || p.first_name_th || p.master_fname || '') + (p.lname_th || p.last_name_th || p.master_lname || '')).toLowerCase();
          if (name.indexOf('ทดสอบ') !== -1 || name.indexOf('สแกนนิ้ว') !== -1 || name.indexOf('cit1') !== -1) return false;
          const key = String(p.user_pin || p.pin || p.id);
          if (seen[key]) return false;
          seen[key] = true;
          return true;
        });
        window.allPersonnelList = cleaned;
        if (typeof currentPersonnelList !== 'undefined') {
          currentPersonnelList = cleaned;
        }
      }
      if (typeof callback === 'function') callback(window.allPersonnelList || []);
    })
    .withFailureHandler(function() {
      if (typeof callback === 'function') callback([]);
    })
    .getPersonnelList('all', 'all', 'all');
}

/**
 * Custom Matcher สำหรับ Select2 ค้นหาได้ทั้งชื่อ-นามสกุล และรหัส PIN
 * แม้ข้อความที่แสดงในตัวเลือกจะแสดงเฉพาะ 'คำนำหน้า ชื่อ นามสกุล' ตาม System Rule ข้อ 13
 */
function select2MatcherWithPin(params, data) {
  if ($.trim(params.term) === '') return data;
  if (typeof data.text === 'undefined') return null;
  const term = params.term.toLowerCase();
  const text = data.text.toLowerCase();
  const pin = String($(data.element).data('pin') || $(data.element).val() || '').toLowerCase();
  if (text.indexOf(term) > -1 || pin.indexOf(term) > -1) {
    return data;
  }
  return null;
}

/**
 * เติมรายชื่อบุคลากรลงใน Select filter ของ License Center
 */
function populateLicenseStaffFilter(selectedPin) {
  const $select = $('#licFilterStaffSelect').length ? $('#licFilterStaffSelect') : $('#licFilterStaff');
  const curRole = (window.currentUserRole || 'guest').toLowerCase();
  const isAdmin = (curRole === 'super_admin' || curRole === 'hr_admin' || curRole === 'admin');
  const myPin = String(window.currentUserPin || (typeof currentAdminUser !== 'undefined' && currentAdminUser ? currentAdminUser.pin : '') || '');
  const isViewSelf = (window.licenseCenterViewMode === 'self');

  $select.empty();

  if (isAdmin && !isViewSelf) {
    ensurePersonnelListLoaded(function(list) {
      const rawList = (list && list.length > 0) ? list : (window.allPersonnelList || []);
      const activeList = rawList.filter(isStaffActiveOrStudying);
      $select.empty();
      $select.append(`<option value="all">-- บุคลากรทั้งหมด (${activeList.length} คน) --</option>`);
      activeList.forEach(p => {
        const pin = String(p.user_pin || p.pin || p.id || '');
        const fname = p.fname_th || p.first_name_th || p.master_fname || '';
        const lname = p.lname_th || p.last_name_th || p.master_lname || '';
        const title = p.title_th || '';
        const name = (fname || lname) ? `${title}${fname} ${lname}`.trim() : (p.name || `PIN #${pin}`);
        $select.append(`<option value="${pin}" data-pin="${pin}">${name}</option>`);
      });
      $select.prop('disabled', false);
      const targetVal = (selectedPin && selectedPin !== 0 && selectedPin !== 'all') ? String(selectedPin) : 'all';
      $select.val(targetVal);
      if ($.fn.select2) {
        $select.select2({
          theme: 'bootstrap-5',
          width: '100%',
          matcher: select2MatcherWithPin
        });
        $select.val(targetVal).trigger('change.select2');
      }
    });
  } else {
    // โหมดข้อมูลส่วนตัวของตนเอง (ทั้ง Staff และ Admin ที่เปิดดูข้อมูลของตนเอง)
    const list = window.allPersonnelList || (typeof currentPersonnelList !== 'undefined' ? currentPersonnelList : []);
    const me = list.find(p => String(p.user_pin || p.pin || p.id) === myPin) || {};
    const fname = me.fname_th || me.first_name_th || me.master_fname || '';
    const lname = me.lname_th || me.last_name_th || me.master_lname || '';
    const title = me.title_th || '';
    let name = (fname || lname) ? `${title}${fname} ${lname}`.trim() : '';
    if (!name && typeof currentAdminUser !== 'undefined' && currentAdminUser && currentAdminUser.name) {
      name = currentAdminUser.name;
    }
    if (!name) name = `PIN #${myPin}`;
    $select.append(`<option value="${myPin}">${name}</option>`);
    $select.val(myPin);
    $select.prop('disabled', true);
  }
}

/**
 * กรองข้อมูลและแสดงผลบนตาราง Universal DataTable
 */
function applyLicenseCenterFilters() {
  const curRole = (window.currentUserRole || 'guest').toLowerCase();
  const isAdmin = (curRole === 'super_admin' || curRole === 'hr_admin' || curRole === 'admin');
  const myPin = String(window.currentUserPin || (typeof currentAdminUser !== 'undefined' && currentAdminUser ? currentAdminUser.pin : '') || '');
  const isViewSelf = (window.licenseCenterViewMode === 'self');
  const showStaffCol = (isAdmin && !isViewSelf);

  // ตัวกรองทำงานเฉพาะแอดมินในโหมดดูภาพรวมทั้งวิทยาลัย (ถ้าเป็น user ทั่วไป ให้เป็น 'all' เพื่อไม่ให้เผลอซ่อนข้อมูล)
  const filterStaff = showStaffCol ? ($('#licFilterStaffSelect').val() || $('#licFilterStaff').val() || 'all') : 'all';
  const filterTargetGroup = showStaffCol ? ($('#licFilterTargetGroup').val() || 'all') : 'all';
  const filterDocCat = showStaffCol ? ($('#licFilterDocCategory').val() || $('#licFilterDocCat').val() || 'all') : 'all';
  const filterStatus = showStaffCol ? ($('#licFilterStatusSelect').val() || $('#licFilterStatus').val() || 'all') : 'all';

  const personnelList = window.allPersonnelList || (typeof currentPersonnelList !== 'undefined' ? currentPersonnelList : []);

  const filtered = (window.allLicensesCache || []).filter(item => {
    const itemPin = String(item.user_pin || item.pin || item.staff_id || '');

    // 0. ถ้าอยู่ในโหมดดูของตนเอง บังคับเฉพาะ PIN ตนเอง
    if ((!isAdmin || isViewSelf) && myPin) {
      if (itemPin !== myPin) return false;
    }

    // 1. กรองรายบุคคล
    if (filterStaff !== 'all' && itemPin !== String(filterStaff)) {
      return false;
    }

    // 2. กรองประเภทเอกสาร
    if (filterDocCat !== 'all' && item.doc_category !== filterDocCat) {
      return false;
    }

    // 3. กรองกลุ่มเป้าหมาย (อาจารย์ vs สายสนับสนุน)
    if (filterTargetGroup !== 'all') {
      const person = personnelList.find(p => String(p.user_pin || p.pin || p.id) === itemPin) || {};
      const jobLine = item.job_line || person.job_line || '';
      const posTitle = item.position_title || person.position_title || person.position || '';
      const posType = item.position_type || person.position_type || person.master_user_type || '';

      const isTeacher = (jobLine === 'สายสอน' || posTitle.includes('อาจารย์') || (posType === 'จ้างเหมาบริการ' && posTitle.includes('อาจารย์')));

      if (filterTargetGroup === 'teacher' || filterTargetGroup === 'faculty') {
        if (!isTeacher) return false;
      } else if (filterTargetGroup === 'support' || filterTargetGroup === 'civil') {
        if (isTeacher) return false;
      }
    }

    // 4. กรองสถานะวันหมดอายุ (ตรวจเช็กวันคงเหลือ <= 30 วันและหมดอายุอย่างเคร่งครัด)
    if (filterStatus !== 'all') {
      const dLeft = (item.days_left !== undefined && item.days_left !== null) ? Number(item.days_left) : null;
      if (filterStatus === 'critical_expired') {
        const isCritExp = (dLeft !== null) ? (dLeft <= 30) : (item.calc_status === 'critical_30' || item.calc_status === 'expired');
        if (!isCritExp) return false;
      } else if (filterStatus === 'critical_30') {
        const isCrit = (dLeft !== null) ? (dLeft >= 0 && dLeft <= 30) : (item.calc_status === 'critical_30');
        if (!isCrit) return false;
      } else if (filterStatus === 'expired') {
        const isExp = (dLeft !== null) ? (dLeft < 0) : (item.calc_status === 'expired');
        if (!isExp) return false;
      } else if (filterStatus === 'expiring_soon') {
        const isExpSoon = (dLeft !== null) ? (dLeft > 30 && dLeft <= 90) : (item.calc_status === 'expiring_soon');
        if (!isExpSoon) return false;
      } else if (filterStatus === 'valid') {
        const isValid = (dLeft !== null) ? (dLeft > 90) : (item.calc_status === 'valid');
        if (!isValid) return false;
      } else if (item.calc_status !== filterStatus) {
        return false;
      }
    }

    return true;
  });

  // อัปเดตตัวเลขแสดงผล
  $('#licenseCountBadge').text(`${filtered.length.toLocaleString()} / ${(window.allLicensesCache || []).length.toLocaleString()} รายการ`);

  // ทำลาย DataTable เก่าถ้ามีอยู่
  if ($.fn.DataTable.isDataTable('#licenseMainTable')) {
    $('#licenseMainTable').DataTable().destroy();
  }

  // กำหนด Default Fallback Avatar กลางประจำระบบ ป้องกันปัญหา URL parsing
  window.PRIMIS_FALLBACK_AVATAR = (typeof DEFAULT_STAFF_AVATAR !== 'undefined' ? DEFAULT_STAFF_AVATAR : '');

  // สร้างหัวตาราง (Thead) แบบไดนามิก: แอดมินมี 8 คอลัมน์ (แสดงคอลัมน์บุคลากร), User ทั่วไปมี 7 คอลัมน์ (ตัดคอลัมน์บุคลากรออก)
  let theadHtml = '<tr><th class="ps-3 text-center" style="width: 50px;">ลำดับ</th>';
  if (showStaffCol) {
    theadHtml += '<th style="min-width: 170px;">บุคลากรผู้ถือเอกสาร</th>';
  }
  theadHtml += '<th style="min-width: 140px;">ประเภท</th>' +
    '<th style="min-width: 200px;">ชื่อเอกสาร และ บัตร</th>' +
    '<th style="min-width: 120px;">เลขที่เอกสาร</th>' +
    '<th style="min-width: 95px;" class="text-center">วันหมดอายุ</th>' +
    '<th style="min-width: 135px;" class="text-center">สถานะ และ วันคงเหลือ</th>' +
    '<th class="text-center pe-3" style="width: 105px;">จัดการ</th>' +
    '</tr>';
  $('#licenseMainTable thead').html(theadHtml);

  const $tbody = $('#licenseMainTableBody');
  $tbody.empty();

  const totalCols = showStaffCol ? 8 : 7;
  if (filtered.length === 0) {
    $tbody.html('<tr><td colspan="' + totalCols + '" class="text-center py-4 text-muted"><i class="bi bi-inbox fs-2 d-block mb-1 text-secondary opacity-50"></i>ไม่พบข้อมูลใบอนุญาตหรือบัตรราชการตามเงื่อนไขที่เลือก</td></tr>');
    return;
  }

  filtered.forEach((l, idx) => {
    // ข้อมูลบุคลากร
    const itemPin = String(l.user_pin || l.pin || l.staff_id || '');
    const person = personnelList.find(p => String(p.user_pin || p.pin || p.id) === itemPin) || {};

    let avatar = l.avatar_url || l.photo_url || person.photo_url || person.avatar;
    if (!avatar) avatar = window.PRIMIS_FALLBACK_AVATAR;

    let fullName = `${l.title_th || ''}${l.first_name_th || l.fname || ''} ${l.last_name_th || l.lname || ''}`.trim();
    if (!fullName || fullName === 'PIN #' + itemPin) {
      const pFname = person.fname_th || person.first_name_th || person.master_fname || '';
      const pLname = person.lname_th || person.last_name_th || person.master_lname || '';
      const pTitle = person.title_th || '';
      if (pFname || pLname) {
        fullName = `${pTitle}${pFname} ${pLname}`.trim();
      }
    }
    if (!fullName) fullName = `PIN #${itemPin}`;

    // เซลล์บุคลากร (เฉพาะแอดมิน) - รูป 26px + ชื่อ + PIN บรรทัดเดียวเป๊ะ
    let staffCell = '';
    if (showStaffCol) {
      staffCell = '<td class="text-nowrap">' +
        '<div class="d-inline-flex align-items-center gap-2">' +
        '<img src="' + avatar + '" class="rounded-circle border" style="width: 26px; height: 26px; object-fit: cover;" onerror="this.src=window.PRIMIS_FALLBACK_AVATAR">' +
        '<span class="fw-bold text-dark text-nowrap">' + escapeHtml(fullName) + '</span>' +
        '<span class="badge bg-light text-primary border" style="font-size:0.75rem;">#' + itemPin + '</span>' +
        '</div></td>';
    }

    // ประเภทเอกสาร
    const catBadge = (l.doc_category === 'civil_card')
      ? '<span class="badge bg-secondary-subtle text-secondary border text-nowrap"><i class="fa-solid fa-id-card me-1"></i>บัตรราชการ/พนักงาน</span>'
      : '<span class="badge bg-primary-subtle text-primary border text-nowrap"><i class="fa-solid fa-award me-1"></i>ใบอนุญาตวิชาชีพ</span>';

    // ชื่อเอกสาร (1 บรรทัดพร้อม ellipsis)
    const titleHtml = '<div class="license-title-cell text-nowrap fw-bold text-dark" title="' + escapeHtml(l.license_title || '-') + '">' + escapeHtml(l.license_title || '-') + '</div>';

    // วันหมดอายุและสถานะ
    let daysLeft = l.days_left;
    if (daysLeft === undefined || daysLeft === null) {
      if (l.expiry_date) {
        const exp = new Date(l.expiry_date);
        const now = new Date();
        daysLeft = Math.ceil((exp - now) / (1000 * 60 * 60 * 24));
      }
    }

    let countdownBadge = '-';
    if (daysLeft !== undefined && daysLeft !== null && !isNaN(daysLeft)) {
      if (daysLeft < 0) {
        countdownBadge = '<span class="badge bg-danger text-white rounded-pill px-2.5 py-1 text-nowrap"><i class="fa-solid fa-circle-xmark me-1"></i>หมดอายุแล้ว</span>';
      } else if (daysLeft <= 30) {
        countdownBadge = '<span class="badge bg-danger-subtle text-danger border border-danger rounded-pill px-2.5 py-1 fw-bold text-nowrap"><i class="fa-solid fa-triangle-exclamation me-1"></i>วิกฤตอีก ' + daysLeft + ' วัน</span>';
      } else if (daysLeft <= 90) {
        countdownBadge = '<span class="badge bg-warning-subtle text-dark border border-warning rounded-pill px-2.5 py-1 fw-bold text-nowrap"><i class="fa-solid fa-clock me-1"></i>เตือนอีก ' + daysLeft + ' วัน</span>';
      } else {
        countdownBadge = '<span class="badge bg-success-subtle text-success border border-success rounded-pill px-2.5 py-1 text-nowrap"><i class="fa-solid fa-circle-check me-1"></i>ปกติ (เหลือ ' + daysLeft + ' วัน)</span>';
      }
    } else {
      countdownBadge = '<span class="badge bg-secondary-subtle text-secondary border text-nowrap">ไม่ระบุวันหมดอายุ</span>';
    }

    // สิทธิ์การจัดการ:
    // - ดูรายละเอียด: ทุกคนที่เข้าสู่ระบบแล้ว
    // - แก้ไขข้อมูล: เจ้าของข้อมูล (Staff) หรือ Admin
    // - ลบข้อมูล: เฉพาะ HR Admin / Super Admin เท่านั้น (ซ่อนปุ่มลบจาก Staff เพื่อป้องกันข้อมูลสูญหาย)
    const canEditThis = (isAdmin || (Boolean(myPin) && itemPin === myPin));
    let actionBtns = '<div class="btn-group btn-group-sm" role="group">' +
      '<button type="button" class="btn btn-outline-primary btn-sm px-2" onclick="viewLicenseDetail(' + l.id + ')" title="ดูรายละเอียดบัตร/เอกสาร">' +
      '<i class="fa-solid fa-eye"></i></button>';
    if (canEditThis) {
      actionBtns += '<button type="button" class="btn btn-outline-warning btn-sm px-2" onclick="editLicenseRecord(' + l.id + ')" title="แก้ไขข้อมูล">' +
        '<i class="fa-solid fa-pencil"></i></button>';
    }
    if (isAdmin) {
      actionBtns += '<button type="button" class="btn btn-outline-danger btn-sm px-2" onclick="deleteLicenseRecordConfirm(' + l.id + ')" title="ลบข้อมูล (เฉพาะเจ้าหน้าที่ HR)">' +
        '<i class="fa-solid fa-trash"></i></button>';
    }
    actionBtns += '</div>';

    const rowHtml = '<tr>' +
      '<td class="text-center fw-bold text-muted ps-3 text-nowrap">' + (idx + 1) + '</td>' +
      staffCell +
      '<td class="text-nowrap">' + catBadge + '</td>' +
      '<td>' + titleHtml + '</td>' +
      '<td class="text-nowrap"><code class="fw-bold text-dark">' + escapeHtml(l.license_number || '-') + '</code></td>' +
      '<td class="text-center text-nowrap fw-medium text-dark">' + (l.expiry_date ? formatDateTh(l.expiry_date) : '-') + '</td>' +
      '<td class="text-center text-nowrap">' + countdownBadge + '</td>' +
      '<td class="text-center pe-3 text-nowrap">' + actionBtns + '</td>' +
      '</tr>';
    $tbody.append(rowHtml);
  });

  // ผูก DataTable ใหม่ โดยจัดเรียงตามคอลัมน์วันหมดอายุ
  const expiryColIdx = showStaffCol ? 5 : 4;
  $('#licenseMainTable').DataTable({
    pageLength: 10,
    lengthMenu: [[10, 25, 50, -1], [10, 25, 50, "ทั้งหมด"]],
    language: {
      url: '//cdn.datatables.net/plug-ins/1.13.7/i18n/th.json'
    },
    order: [[expiryColIdx, 'asc']],
    responsive: false,
    autoWidth: false
  });
}

/**
 * ดูรายละเอียดข้อมูลใบอนุญาต / บัตรราชการทั้งหมดใน Modal Popup
 * @param {number|string} licenseId
 */
function viewLicenseDetail(licenseId) {
  const item = (window.allLicensesCache || []).find(l => Number(l.id) === Number(licenseId));
  if (!item) {
    Swal.fire('ไม่พบข้อมูล', 'ไม่พบรายละเอียดเอกสารที่เลือก', 'warning');
    return;
  }

  window.currentViewingLicenseId = licenseId;

  const personnelList = window.allPersonnelList || (typeof currentPersonnelList !== 'undefined' ? currentPersonnelList : []);
  const itemPin = String(item.user_pin || item.pin || item.staff_id || '');
  const person = personnelList.find(p => String(p.user_pin || p.pin || p.id) === itemPin) || {};

  let avatar = item.avatar_url || item.photo_url || person.photo_url || person.avatar;
  if (!avatar) avatar = window.PRIMIS_FALLBACK_AVATAR || (typeof DEFAULT_STAFF_AVATAR !== 'undefined' ? DEFAULT_STAFF_AVATAR : '');

  let fullName = `${item.title_th || ''}${item.first_name_th || item.fname || ''} ${item.last_name_th || item.lname || ''}`.trim();
  if (!fullName || fullName === 'PIN #' + itemPin) {
    const pFname = person.fname_th || person.first_name_th || person.master_fname || '';
    const pLname = person.lname_th || person.last_name_th || person.master_lname || '';
    const pTitle = person.title_th || '';
    if (pFname || pLname) fullName = `${pTitle}${pFname} ${pLname}`.trim();
  }
  if (!fullName) fullName = `PIN #${itemPin}`;

  const pos = item.position_title || person.position_title || 'บุคลากร';
  const dept = item.department_name || person.department || item.department || '';

  // 1. ผู้ถือเอกสาร
  $('#licDetailAvatar').attr('src', avatar);
  $('#licDetailFullName').text(fullName);
  $('#licDetailPinBadge').text('#' + itemPin);
  $('#licDetailPositionDept').text(pos + (dept ? ' • ' + dept : ''));

  // 2. ข้อมูลเอกสาร
  const isCivil = (item.doc_category === 'civil_card');
  $('#licDetailDocCategory').html(isCivil 
    ? '<span class="badge bg-secondary-subtle text-secondary border px-2 py-1"><i class="fa-solid fa-id-card me-1"></i>บัตรข้าราชการ/บัตรพนักงานราชการ</span>'
    : '<span class="badge bg-primary-subtle text-primary border px-2 py-1"><i class="fa-solid fa-award me-1"></i>ใบอนุญาตประกอบวิชาชีพ</span>'
  );

  const roundNum = Number(item.renewal_round);
  $('#licDetailRenewalRound').text(roundNum === 0 ? 'ครั้งแรก (ออกบัตรใหม่)' : `ต่ออายุ ครั้งที่ ${roundNum || 1}`);

  $('#licDetailLicenseTitle').text(item.license_title || '-');
  $('#licDetailLicenseNumber').text(item.license_number || '-');
  $('#licDetailIssuingCouncil').text(item.issuing_council || (isCivil ? 'วิทยาลัยพยาบาลบรมราชชนนี สวรรค์ประชารักษ์ นครสวรรค์' : 'สภาการพยาบาล'));

  $('#licDetailIssueDate').text(item.issue_date ? formatDateTh(item.issue_date) : '-');
  $('#licDetailExpiryDate').text(item.expiry_date ? formatDateTh(item.expiry_date) : '-');

  // Days left & status badge
  let daysLeft = item.days_left;
  if (daysLeft === undefined || daysLeft === null) {
    if (item.expiry_date) {
      const exp = new Date(item.expiry_date);
      const now = new Date();
      daysLeft = Math.ceil((exp - now) / (1000 * 60 * 60 * 24));
    }
  }

  let statusHtml = '<span class="badge bg-secondary-subtle text-secondary border">ไม่ระบุวันหมดอายุ</span>';
  if (daysLeft !== undefined && daysLeft !== null && !isNaN(daysLeft)) {
    if (daysLeft < 0) {
      statusHtml = `<span class="badge bg-danger text-white rounded-pill px-3 py-1.5"><i class="fa-solid fa-circle-xmark me-1"></i>หมดอายุแล้ว (${Math.abs(daysLeft)} วัน)</span>`;
    } else if (daysLeft <= 30) {
      statusHtml = `<span class="badge bg-danger-subtle text-danger border border-danger rounded-pill px-3 py-1.5 fw-bold"><i class="fa-solid fa-triangle-exclamation me-1"></i>วิกฤตอีก ${daysLeft} วัน</span>`;
    } else if (daysLeft <= 90) {
      statusHtml = `<span class="badge bg-warning-subtle text-dark border border-warning rounded-pill px-3 py-1.5 fw-bold"><i class="fa-solid fa-clock me-1"></i>เตือนอีก ${daysLeft} วัน</span>`;
    } else {
      statusHtml = `<span class="badge bg-success-subtle text-success border border-success rounded-pill px-3 py-1.5"><i class="fa-solid fa-circle-check me-1"></i>ปกติ (เหลือ ${daysLeft} วัน)</span>`;
    }
  }
  $('#licDetailStatusBadge').html(statusHtml);

  // Remarks
  if (item.remarks && item.remarks.trim()) {
    $('#licDetailRemarks').text(item.remarks.trim());
    $('#licDetailRemarksContainer').removeClass('d-none');
  } else {
    $('#licDetailRemarksContainer').addClass('d-none');
  }

  // File link
  if (item.doc_url && item.doc_url.trim()) {

/**
 * Event เมื่อเปลี่ยนการเลือกบุคลากรใน Modal
 */
function onLicenseStaffSelectChanged(pin) {
  const pinStr = String(pin || '').trim();
  if (!pinStr) {
    $('#licenseStaffName').text('-');
    $('#licenseStaffPinBadge').text('PIN');
    $('#licenseStaffPosition').text('-');
    $('#licenseStaffPin').val('');
    return;
  }

  const list = window.allPersonnelList || (typeof currentPersonnelList !== 'undefined' ? currentPersonnelList : []);
  let p = list.find(x => String(x.user_pin || x.pin || x.id) === pinStr);

  let displayName = '-';
  let displayPin = pinStr;
  let displayPosition = 'ไม่ระบุตำแหน่ง';
  let jobLine = '';
  let posType = '';

  if (p) {
    const fname = p.fname_th || p.first_name_th || p.master_fname || '';
    const lname = p.lname_th || p.last_name_th || p.master_lname || '';
    const title = p.title_th || '';
    displayName = (fname || lname) ? `${title}${fname} ${lname}`.trim() : (p.name || `PIN #${pinStr}`);
    displayPosition = `${p.position_title || p.position_name || 'ไม่ระบุตำแหน่ง'}${p.position_type ? ' • ' + p.position_type : ''}${p.job_line ? ' • ' + p.job_line : ''}`;
    jobLine = p.job_line || '';
    posType = p.position_type || p.master_user_type || '';
  } else if (typeof currentAdminUser !== 'undefined' && currentAdminUser && String(currentAdminUser.pin || currentAdminUser.id) === pinStr) {
    displayName = currentAdminUser.name || `PIN #${pinStr}`;
    displayPosition = `${currentAdminUser.position_title || currentAdminUser.position_name || 'อาจารย์ / บุคลากร'}${currentAdminUser.department_name ? ' • ' + currentAdminUser.department_name : ''}`;
  } else {
    displayName = `บุคลากร PIN #${pinStr}`;
  }

  // อัปเดตข้อมูลแบบ Minimal สบายตา
  $('#licenseStaffName').text(displayName);
  $('#licenseStaffPinBadge').text('PIN #' + displayPin);
  $('#licenseStaffPosition').text(displayPosition);
  $('#licenseStaffPin').val(displayPin);

  // แนะนำประเภทเอกสารตามกฎระเบียบ ถ้าเป็นการเพิ่มใหม่
  if (!$('#licenseRecordId').val()) {
    const isFaculty = (jobLine === 'สายสอน' || displayPosition.includes('อาจารย์') || displayName.includes('อาจารย์'));
    if (isFaculty) {
      $('#licenseDocCategory').val('license');
      onLicenseDocCategoryChanged('license');
    } else {
      $('#licenseDocCategory').val('civil_card');
      onLicenseDocCategoryChanged('civil_card');
    }
  }
}

/**
 * คำนวณวันหมดอายุแบบ Real-time แสดงผลใน Modal
 */
function calcLicenseDaysCountdown() {
  const issueVal = $('#licenseIssueDate').val();
  const expiryVal = $('#licenseExpiryDate').val();
  const $badge = $('#licenseDaysCountdownBadge');

  if (issueVal && typeof formatFullThaiDate === 'function') {
    $('#licenseIssueDateTh').text(formatFullThaiDate(issueVal));
  } else {
    $('#licenseIssueDateTh').text('-');
  }

  if (expiryVal && typeof formatFullThaiDate === 'function') {
    $('#licenseExpiryDateTh').text(formatFullThaiDate(expiryVal));
  } else {
    $('#licenseExpiryDateTh').text('-');
  }

  if (!expiryVal) {
    $badge.html('<span class="badge bg-secondary-subtle text-secondary border">ยังไม่ได้กำหนดวันหมดอายุ</span>');
    return;
  }

  const expDate = new Date(expiryVal);
  const now = new Date();
  const daysLeft = Math.ceil((expDate - now) / (1000 * 60 * 60 * 24));

  if (daysLeft < 0) {
    $badge.html(`<span class="badge bg-danger text-white border"><i class="bi bi-x-circle me-1"></i>หมดอายุแล้ว (${Math.abs(daysLeft)} วัน)</span>`);
  } else if (daysLeft <= 30) {
    $badge.html(`<span class="badge bg-danger-subtle text-danger border border-danger fw-bold"><i class="bi bi-exclamation-triangle-fill me-1"></i>วิกฤต (เหลือ ${daysLeft} วัน)</span>`);
  } else if (daysLeft <= 90) {
    $badge.html(`<span class="badge bg-warning-subtle text-dark border border-warning fw-bold"><i class="bi bi-clock-history me-1"></i>เตือนใกล้หมดอายุ (เหลือ ${daysLeft} วัน)</span>`);
  } else {
    $badge.html(`<span class="badge bg-success-subtle text-success border border-success"><i class="bi bi-check-circle me-1"></i>ปกติ (เหลือ ${daysLeft} วัน)</span>`);
  }
}

/**
 * บันทึกข้อมูลใบอนุญาต/บัตรเข้าสู่เซิร์ฟเวอร์
 */
function submitLicenseRecordForm() {
  const curRole = (window.currentUserRole || 'guest').toLowerCase();
  const isAdmin = (curRole === 'super_admin' || curRole === 'hr_admin');
  const myPin = String(window.currentUserPin || (typeof currentAdminUser !== 'undefined' && currentAdminUser ? currentAdminUser.pin : '') || '');

  let staffPin = $('#licenseStaffPin').val();
  if (isAdmin && !staffPin) {
    staffPin = $('#licenseStaffSelect').val();
  }
  if (!staffPin) {
    staffPin = myPin;
  }

  const title = $('#licenseTitle').val().trim();
  const number = $('#licenseNumber').val().trim();
  const docCategory = $('#licenseDocCategory').val();
  const council = $('#licenseIssuingCouncil').val().trim();
  const issueDate = $('#licenseIssueDate').val() || null;
  const expiryDate = $('#licenseExpiryDate').val() || null;
  const renewalRoundVal = $('#licenseRenewalRound').val();
  const renewalRound = (renewalRoundVal !== '' && renewalRoundVal !== null && !isNaN(renewalRoundVal)) ? parseInt(renewalRoundVal, 10) : 0;
  const docUrl = $('#licenseDocUrl').val().trim();
  const remarks = $('#licenseRemarks').val().trim();

  if (!staffPin) {
    Swal.fire('กรุณาระบุข้อมูล', 'กรุณาเลือกบุคลากรผู้ถือเอกสาร', 'warning');
    return;
  }
  if (!title) {
    Swal.fire('กรุณาระบุข้อมูล', 'กรุณาระบุชื่อใบอนุญาต หรือชื่อบัตรประจำตัว', 'warning');
    return;
  }
  if (!number) {
    Swal.fire('กรุณาระบุข้อมูล', 'กรุณาระบุเลขที่ใบอนุญาต หรือเลขที่บัตร', 'warning');
    return;
  }
  if (!expiryDate) {
    Swal.fire('กรุณาระบุข้อมูล', 'กรุณาระบุวันหมดอายุของเอกสาร', 'warning');
    return;
  }

  const payload = {
    id: $('#licenseRecordId').val() || null,
    staff_id: parseInt(staffPin),
    pin: parseInt(staffPin),
    doc_category: docCategory,
    license_title: title,
    license_number: number,
    issuing_council: council || (docCategory === 'license' ? 'สภาการพยาบาล' : 'วิทยาลัยพยาบาลบรมราชชนนี สวรรค์ประชารักษ์ นครสวรรค์'),
    issue_date: issueDate,
    expiry_date: expiryDate,
    renewal_round: renewalRound,
    doc_url: docUrl || null,
    remarks: remarks || null,
    operator_pin: parseInt(myPin) || 0,
    operator_role: curRole
  };

  showPpmsLoading('กำลังบันทึกข้อมูล...', 'กำลังบันทึกข้อมูลใบอนุญาต/บัตรประจำตัว');
  google.script.run
    .withSuccessHandler(function(res) {
      Swal.close();
      if (!res || (res.status !== 'success' && !res.success)) {
        Swal.fire({
          icon: 'error',
          title: 'บันทึกข้อมูลไม่สำเร็จ',
          text: (res && res.message) ? res.message : 'เกิดข้อผิดพลาดในการบันทึกข้อมูล'
        });
        return;
      }

      const modalEl = document.getElementById('editLicenseModal');
      const modal = bootstrap.Modal.getInstance(modalEl);
      if (modal) modal.hide();

      Swal.fire({
        icon: 'success',
        title: 'บันทึกข้อมูลสำเร็จ',
        text: 'ระบบได้อัปเดตข้อมูลใบประกอบวิชาชีพ/บัตรข้าราชการเรียบร้อยแล้ว',
        timer: 1600,
        showConfirmButton: false
      });

      // รีเฟรชตารางกลาง
      loadLicenseCenterTable(0, true);

      // หากกำลังเปิดดู In-pane Detail ของบุคลากรคนนี้อยู่ ให้โหลด Tab 4 ใหม่ด้วย

        if (typeof viewPersonnelInPaneDetail === 'function') {

        }
      }

    .withFailureHandler(function(err) {
      Swal.close();
      Swal.fire({
        icon: 'error',
        title: 'เกิดข้อผิดพลาด',
        text: err ? err.toString() : 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้'
      });
    })
    .saveLicenseRecord(payload);
}

      showPpmsLoading('กำลังลบข้อมูล...', 'กำลังลบรายการใบอนุญาต/บัตร');
      const operatorPin = parseInt(myPin) || 0;
      google.script.run
        .withSuccessHandler(function(res) {
          Swal.close();
          if (!res || (res.status !== 'success' && !res.success)) {
            Swal.fire('ลบไม่สำเร็จ', (res && res.message) ? res.message : 'เกิดข้อผิดพลาด', 'error');
            return;
          }

          Swal.fire({
            icon: 'success',
            title: 'ลบข้อมูลสำเร็จ',
            text: 'รายการดังกล่าวถูกลบออกจากระบบแล้ว',
            timer: 1500,
            showConfirmButton: false
          });

          loadLicenseCenterTable(0, true);
        })

  });
}

/**
 * ส่งออกรายงานใบอนุญาตและบัตรเป็นไฟล์ CSV (UTF-8 พร้อม BOM)
 */
function exportLicenseReportCsv() {
  const data = window.allLicensesCache || [];
  if (data.length === 0) {
    Swal.fire('ไม่มีข้อมูล', 'ไม่มีข้อมูลสำหรับส่งออกรายงาน', 'info');
    return;
  }

  let csvContent = '\uFEFFลำดับ,PIN,ชื่อ-นามสกุล,ตำแหน่ง,ประเภทบุคลากร,สายงาน,ประเภทเอกสาร,ชื่อใบอนุญาต/บัตร,เลขที่เอกสาร,สภาวิชาชีพ/ผู้ออกบัตร,วันที่ออกบัตร,วันหมดอายุ,วันคงเหลือ,ต่ออายุครั้งที่,สถานะ\n';

  data.forEach((d, idx) => {
    const fullName = `${d.title_th || ''}${d.first_name_th || ''} ${d.last_name_th || ''}`.trim();
    const docCatTh = (d.doc_category === 'civil_card') ? 'บัตรข้าราชการ/บัตรพนักงานราชการ' : 'ใบอนุญาตวิชาชีพ';
    const roundTh = Number(d.renewal_round) === 0 ? 'ครั้งแรก' : 'ต่ออายุครั้งที่ ' + (d.renewal_round || 1);
    const statusTh = (d.calc_status === 'valid') ? 'ปกติ' : (d.calc_status === 'expiring_soon' ? 'ใกล้หมดอายุ (เตือน 90 วัน)' : (d.calc_status === 'critical_30' ? 'วิกฤต (≤30 วัน)' : 'หมดอายุแล้ว'));

    const row = [
      idx + 1,
      `"${d.user_pin || ''}"`,
      `"${fullName}"`,
      `"${d.position_title || ''}"`,
      `"${d.position_type || d.master_user_type || ''}"`,
      `"${d.job_line || ''}"`,
      `"${docCatTh}"`,
      `"${d.license_title || ''}"`,
      `"${d.license_number || ''}"`,
      `"${d.issuing_council || ''}"`,
      `"${d.issue_date || ''}"`,
      `"${d.expiry_date || ''}"`,
      `"${d.days_left !== undefined ? d.days_left : ''}"`,
      `"${roundTh}"`,
      `"${statusTh}"`
    ];

    csvContent += row.join(',') + '\n';
  });

  const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.setAttribute('href', url);
  link.setAttribute('download', `license_alert_report_${new Date().toISOString().slice(0, 10)}.csv`);
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

let currentAcademicPositions = [];
let currentAcademicStaffPin = '';

function loadInPaneAcademicPositions(pin, prefetched) {
  if (!pin) return;
  currentAcademicStaffPin = String(pin).trim();

  if (Array.isArray(prefetched)) {
    currentAcademicPositions = prefetched;
    renderInPaneAcademicTable(currentAcademicPositions);
    return;
  }

  const $tbody = $('#inPaneAcademicTableBody');
  $tbody.html('<tr><td colspan="7" class="text-center py-4 text-muted"><i class="fa-solid fa-spinner fa-spin me-2 text-primary"></i>กำลังโหลดข้อมูลตำแหน่งทางวิชาการ...</td></tr>');

  google.script.run
    .withSuccessHandler(function(res) {
      if (res && res.status === 'success' && Array.isArray(res.data)) {
        currentAcademicPositions = res.data;
        renderInPaneAcademicTable(currentAcademicPositions);
      } else {
        renderInPaneAcademicTable([]);
      }
    })
    .withFailureHandler(function(err) {
      $tbody.html(`<tr><td colspan="7" class="text-center py-4 text-danger">การเชื่อมต่อขัดข้อง: ${err.message}</td></tr>`);
    })
    .getAcademicPositions(pin);
}

function renderInPaneAcademicTable(records) {
  const $tbody = $('#inPaneAcademicTableBody');
  $tbody.empty();

  const list = Array.isArray(records) ? records.slice() : [];
  // เรียงลำดับรายการล่าสุดไว้บนสุด (Sort by submission_date DESC, id DESC)
  list.sort(function(a, b) {
    const da = a.submission_date || '';
    const db = b.submission_date || '';
    if (db !== da) return db.localeCompare(da);
    return (b.id || 0) - (a.id || 0);
  });

  $('#inPaneAcademicCountBadge').text(`${list.length} รายการ`);

  // อัปเดต Banner ตำแหน่งปัจจุบัน
  const currentAppointed = list.find(r => r.status === 'appointed') || (list.length > 0 ? list[0] : null);
  if (currentAppointed) {
    const titleText = currentAppointed.academic_title || 'อาจารย์';
    $('#inPaneCurrentAcademicTitle').text(titleText);
    const branchText = currentAppointed.academic_branch ? `สาขาวิชา: ${currentAppointed.academic_branch}` : 'ไม่ระบุสาขาวิชา';
    const orderText = currentAppointed.order_number ? ` • คำสั่ง: ${currentAppointed.order_number}` : '';
    const appDateText = currentAppointed.appointed_date ? ` (มีผล ${typeof formatThaiDateShort === 'function' ? formatThaiDateShort(currentAppointed.appointed_date) : currentAppointed.appointed_date})` : '';
    const meetingText = currentAppointed.council_meeting_no ? ` • มติสภา: ${currentAppointed.council_meeting_no}` : '';
    $('#inPaneCurrentAcademicBranch').text(branchText + orderText + appDateText + meetingText);
  } else {
    $('#inPaneCurrentAcademicTitle').text('อาจารย์');
    $('#inPaneCurrentAcademicBranch').text('ยังไม่มีประวัติการยื่นคำขอตำแหน่งทางวิชาการในระบบ');
  }

  if (list.length === 0) {
    $tbody.html(`
      <tr>
        <td colspan="7" class="text-center py-4 text-muted">
          <i class="fa-solid fa-award fs-3 text-secondary opacity-50 d-block mb-2"></i>
          <div>ยังไม่มีประวัติการยื่นคำขอตำแหน่งทางวิชาการ</div>
          <div class="small mt-1">คลิกปุ่ม "+ ยื่นคำขอ / บันทึกประวัติ" ด้านบนเพื่อเริ่มบันทึกคำขอขาขึ้นค่ะ</div>
        </td>
      </tr>
    `);
    return;
  }

  const curRole = (window.currentUserRole || '').toLowerCase();
  const canEdit = (curRole === 'super_admin' || curRole === 'hr_admin' || String(window.currentUserPin) === String(currentAcademicStaffPin));

  list.forEach(function(r, idx) {
    const isTop = (idx === 0);
    const subDateStr = r.submission_date ? (typeof formatThaiDateShort === 'function' ? formatThaiDateShort(r.submission_date) : r.submission_date) : '-';
    const appDateStr = r.appointed_date ? (typeof formatThaiDateShort === 'function' ? formatThaiDateShort(r.appointed_date) : r.appointed_date) : '-';

    // Status Badge & Stage Description
    let statusBadge = '';
    switch (r.status) {
      case 'submitted':
        statusBadge = '<span class="badge rounded-pill px-2.5 py-1" style="background-color: #f1f5f9; color: #475569; border: 1px solid #cbd5e1;"><i class="fa-solid fa-file-signature text-primary me-1"></i>1. ยื่นคำขอแล้ว</span>';
        break;
      case 'screening':
        statusBadge = '<span class="badge rounded-pill px-2.5 py-1" style="background-color: #e0f2fe; color: #0369a1; border: 1px solid #7dd3fc;"><i class="fa-solid fa-users-viewfinder me-1"></i>2. กลั่นกรองผลงาน</span>';
        break;
      case 'external_review':
        statusBadge = '<span class="badge rounded-pill px-2.5 py-1" style="background-color: #fef3c7; color: #b45309; border: 1px solid #fcd34d;"><i class="fa-solid fa-envelope-open-text me-1"></i>3. ส่ง Reader ประเมิน</span>';
        break;
      case 'revision':
        statusBadge = '<span class="badge rounded-pill px-2.5 py-1" style="background-color: #ffedd5; color: #c2410c; border: 1px solid #fdba74;"><i class="fa-solid fa-pen-to-square me-1"></i>4. ส่งกลับแก้ไข</span>';
        break;
      case 'council_approval':
        statusBadge = '<span class="badge rounded-pill px-2.5 py-1" style="background-color: #ede9fe; color: #6d28d9; border: 1px solid #c4b5fd;"><i class="fa-solid fa-building-columns me-1"></i>5. สภาสถาบันพิจารณา</span>';
        break;
      case 'appointed':
        statusBadge = '<span class="badge rounded-pill px-2.5 py-1 shadow-2xs" style="background-color: #dcfce7; color: #15803d; border: 1px solid #86efac;"><i class="fa-solid fa-stamp me-1"></i>6. แต่งตั้งสมบูรณ์</span>';
        break;
      case 'rejected':
        statusBadge = '<span class="badge bg-danger-subtle text-danger border border-danger-subtle rounded-pill px-2.5 py-1"><i class="fa-solid fa-circle-xmark me-1"></i>ไม่ผ่าน / ยุติ</span>';
        break;
      default:
        statusBadge = `<span class="badge bg-light text-dark border rounded-pill px-2.5 py-1">${r.status || 'ยื่นคำขอ'}</span>`;
    }

    const currentTag = (isTop && r.status === 'appointed') ? '<span class="badge bg-purple-subtle text-purple border rounded-pill px-2 py-0 ms-1 fw-bold" style="font-size: 0.65rem; background-color: #f3e8ff; color: #7e22ce; border-color: #d8b4fe !important;">ตำแหน่งปัจจุบัน</span>' : '';

    const orderInfo = r.order_number ? `<div>คำสั่ง: <strong>${r.order_number}</strong></div>` : '';
    const dateInfo = (r.appointed_date && r.status === 'appointed') ? `<div class="text-muted" style="font-size: 0.70rem;">มีผล: ${appDateStr}</div>` : '';
    const meetingInfo = r.council_meeting_no ? `<div class="text-secondary" style="font-size: 0.70rem;">มติ: ${r.council_meeting_no}</div>` : '';
    const appointmentCell = (orderInfo || dateInfo || meetingInfo) ? (orderInfo + dateInfo + meetingInfo) : '<span class="text-muted small">-</span>';

    const docLink = r.doc_url ? `<a href="${r.doc_url}" target="_blank" class="btn btn-sm btn-outline-primary rounded-circle" style="width: 28px; height: 28px; padding: 0; line-height: 26px;" title="เปิดเอกสารแนบ"><i class="fa-solid fa-file-pdf"></i></a>` : '<span class="text-muted small">-</span>';

    let actionBtns = '-';
    if (canEdit) {
      actionBtns = `
        <div class="btn-group btn-group-sm">
          <button type="button" class="btn btn-outline-warning btn-sm" onclick="openAcademicPositionModal(${r.id})" title="แก้ไขคำขอนี้">
            <i class="fa-solid fa-pencil"></i>
          </button>
          <button type="button" class="btn btn-outline-danger btn-sm" onclick="deleteAcademicPositionEntry(${r.id})" title="ลบรายการนี้">
            <i class="fa-solid fa-trash-can"></i>
          </button>
        </div>
      `;
    }

    const tr = `
      <tr class="${isTop ? 'table-light' : ''}">
        <td class="text-nowrap fw-medium text-dark">${subDateStr}</td>
        <td>
          <span class="fw-bold text-dark fs-6">${r.academic_title || '-'}</span>
          ${currentTag}
        </td>
        <td class="text-secondary small">${r.academic_branch || '-'}</td>
        <td class="text-center">${statusBadge}</td>
        <td>${appointmentCell}</td>
        <td class="text-center">${docLink}</td>
        <td class="text-center">${actionBtns}</td>
      </tr>
    `;
    $tbody.append(tr);
  });
}

    $('#acadPosId').val(record.id);

      $('#acadPosTitleSelect').val(title);

      $('#acadPosTitleCustom').removeClass('d-none').val(title);

  }

  const myModal = new bootstrap.Modal(document.getElementById('modalAcademicPosition'));
  myModal.show();

  const staffId = $('#acadPosStaffId').val();
  let title = $('#acadPosTitleSelect').val();
  if (title === 'custom') {
    title = $('#acadPosTitleCustom').val().trim();
  }
  if (!title) {
    Swal.fire('ข้อมูลไม่ครบ', 'กรุณาระบุตำแหน่งทางวิชาการ', 'warning');
    return;
  }

  const payload = {
    id: parseInt($('#acadPosId').val()) || 0,
    staff_id: staffId,
    academic_title: title,
    academic_branch: $('#acadPosBranch').val().trim(),
    submission_date: $('#acadPosSubmissionDate').val(),
    status: $('#acadPosStatus').val(),
    appointed_date: $('#acadPosAppointedDate').val(),
    order_number: $('#acadPosOrderNumber').val().trim(),
    council_meeting_no: $('#acadPosCouncilMeeting').val().trim(),
    doc_url: $('#acadPosDocUrl').val().trim(),
    remarks: $('#acadPosRemarks').val().trim(),
    operator_pin: window.currentUserPin || '',
    operator_role: window.currentUserRole || 'staff'
  };

  showPpmsLoading('กำลังบันทึกข้อมูล...', 'กำลังบันทึกคำขอตำแหน่งทางวิชาการเข้าสู่ฐานข้อมูล');

  google.script.run
    .withSuccessHandler(function(res) {
      hidePpmsLoading();
      if (res && res.status === 'success') {
        Swal.fire({
          icon: 'success',
          title: 'บันทึกสำเร็จ',
          text: res.message || 'บันทึกคำขอตำแหน่งทางวิชาการเรียบร้อยแล้วค่ะ',
          timer: 1500,
          showConfirmButton: false

        loadInPaneAcademicPositions(staffId);
      } else {
        Swal.fire('บันทึกไม่สำเร็จ', res ? res.message : 'เกิดข้อผิดพลาดในการบันทึก', 'error');
      }
    })
    .withFailureHandler(function(err) {
      hidePpmsLoading();
      Swal.fire('ข้อผิดพลาด', 'การเชื่อมต่อขัดข้อง: ' + err.message, 'error');
    })

// =========================================================================
let allAcademicTrackingRecords = [];
let academicTrackingDataTable = null;

function loadAllAcademicTracking(forceRefresh) {
  const $tbody = $('#academicTrackingTableBody');
  $tbody.html('<tr><td colspan="9" class="text-center py-4 text-muted"><i class="fa-solid fa-spinner fa-spin me-2 text-primary"></i>กำลังโหลดข้อมูลคำขอตำแหน่งทางวิชาการทั้งสถาบัน...</td></tr>');

  google.script.run
    .withSuccessHandler(function(res) {
      if (res && res.status === 'success' && Array.isArray(res.data)) {
        allAcademicTrackingRecords = res.data;
        updateAcademicTrackingStats(allAcademicTrackingRecords);
        applyAcademicTrackingFilters();
      } else {
        $tbody.html('<tr><td colspan="9" class="text-center py-4 text-muted">ยังไม่มีรายการคำขอตำแหน่งทางวิชาการในระบบ</td></tr>');
        updateAcademicTrackingStats([]);
      }
    })
    .withFailureHandler(function(err) {
      $tbody.html(`<tr><td colspan="9" class="text-center py-4 text-danger">การเชื่อมต่อขัดข้อง: ${err.message}</td></tr>`);
    })
    .getAcademicPositions('all');
}

function updateAcademicTrackingStats(records) {
  const total = records.length;
  let screening = 0;
  let readers = 0;
  let council = 0;
  let appointed = 0;

  records.forEach(r => {
    if (r.status === 'submitted' || r.status === 'screening') screening++;
    else if (r.status === 'external_review' || r.status === 'revision') readers++;
    else if (r.status === 'council_approval') council++;
    else if (r.status === 'appointed') appointed++;
  });

  $('#statAcadTotal').text(total);
  $('#statAcadScreening').text(screening);
  $('#statAcadReaders').text(readers);
  $('#statAcadCouncil').text(council);
  $('#statAcadAppointed').text(appointed);
}

function applyAcademicTrackingFilters() {
  const sTerm = ($('#filterAcadSearch').val() || '').trim().toLowerCase();
  const stFilter = $('#filterAcadStatus').val() || 'all';
  const titleFilter = $('#filterAcadTitle').val() || 'all';

  const filtered = allAcademicTrackingRecords.filter(r => {
    if (stFilter !== 'all' && r.status !== stFilter) return false;
    if (titleFilter !== 'all' && r.academic_title !== titleFilter) return false;

    if (sTerm) {
      const matchText = [
        r.staff_id, r.fname, r.lname, r.academic_title, r.academic_branch,
        r.order_number, r.council_meeting_no, r.remarks
      ].join(' ').toLowerCase();
      if (!matchText.includes(sTerm)) return false;
    }
    return true;
  });

  $('#acadTrackingCountBadge').text(`แสดง ${filtered.length} จาก ${allAcademicTrackingRecords.length} รายการ`);
  renderAcademicTrackingTable(filtered);
}

function renderAcademicTrackingTable(records) {
  if (academicTrackingDataTable) {
    academicTrackingDataTable.destroy();
    academicTrackingDataTable = null;
  }

  const $tbody = $('#academicTrackingTableBody');
  $tbody.empty();

  if (!records || records.length === 0) {
    $tbody.html('<tr><td colspan="9" class="text-center py-4 text-muted"><i class="fa-solid fa-folder-open fs-3 d-block mb-2 opacity-50"></i>ไม่พบข้อมูลคำขอตามเงื่อนไขที่เลือก</td></tr>');
    return;
  }

  records.forEach(r => {
    const pin = String(r.staff_id || '').trim();
    const rawName = ((r.fname || '') + ' ' + (r.lname || '')).trim();
    const nameTh = rawName || ('บุคลากร #' + pin);
    const subDateStr = r.submission_date ? (typeof formatThaiDateShort === 'function' ? formatThaiDateShort(r.submission_date) : r.submission_date) : '-';
    const appDateStr = r.appointed_date ? (typeof formatThaiDateShort === 'function' ? formatThaiDateShort(r.appointed_date) : r.appointed_date) : '-';

    let statusBadge = '';
    switch (r.status) {
      case 'submitted':
        statusBadge = '<span class="badge rounded-pill px-2.5 py-1" style="background-color: #f1f5f9; color: #475569; border: 1px solid #cbd5e1;"><i class="fa-solid fa-file-signature text-primary me-1"></i>1. ยื่นคำขอแล้ว</span>';
        break;
      case 'screening':
        statusBadge = '<span class="badge rounded-pill px-2.5 py-1" style="background-color: #e0f2fe; color: #0369a1; border: 1px solid #7dd3fc;"><i class="fa-solid fa-users-viewfinder me-1"></i>2. กลั่นกรองผลงาน</span>';
        break;
      case 'external_review':
        statusBadge = '<span class="badge rounded-pill px-2.5 py-1" style="background-color: #fef3c7; color: #b45309; border: 1px solid #fcd34d;"><i class="fa-solid fa-envelope-open-text me-1"></i>3. ส่ง Reader</span>';
        break;
      case 'revision':
        statusBadge = '<span class="badge rounded-pill px-2.5 py-1" style="background-color: #ffedd5; color: #c2410c; border: 1px solid #fdba74;"><i class="fa-solid fa-pen-to-square me-1"></i>4. ส่งกลับแก้ไข</span>';
        break;
      case 'council_approval':
        statusBadge = '<span class="badge rounded-pill px-2.5 py-1" style="background-color: #ede9fe; color: #6d28d9; border: 1px solid #c4b5fd;"><i class="fa-solid fa-building-columns me-1"></i>5. สภาสถาบัน</span>';
        break;
      case 'appointed':
        statusBadge = '<span class="badge rounded-pill px-2.5 py-1 shadow-2xs" style="background-color: #dcfce7; color: #15803d; border: 1px solid #86efac;"><i class="fa-solid fa-stamp me-1"></i>6. แต่งตั้งแล้ว</span>';
        break;
      case 'rejected':
        statusBadge = '<span class="badge bg-danger-subtle text-danger border border-danger-subtle rounded-pill px-2.5 py-1"><i class="fa-solid fa-circle-xmark me-1"></i>ไม่ผ่าน</span>';
        break;
      default:
        statusBadge = '<span class="badge bg-light text-dark border rounded-pill px-2.5 py-1">' + (r.status || 'ยื่นคำขอ') + '</span>';
    }

    const orderInfo = r.order_number ? '<div>คำสั่ง: <strong>' + r.order_number + '</strong></div>' : '';
    const dateInfo = (r.appointed_date && r.status === 'appointed') ? '<div class="text-muted" style="font-size: 0.70rem;">มีผล: ' + appDateStr + '</div>' : '';
    const meetingInfo = r.council_meeting_no ? '<div class="text-secondary" style="font-size: 0.70rem;">มติ: ' + r.council_meeting_no + '</div>' : '';
    const appCell = (orderInfo || dateInfo || meetingInfo) ? (orderInfo + dateInfo + meetingInfo) : '<span class="text-muted small">-</span>';

    const docLink = r.doc_url ? '<a href="' + r.doc_url + '" target="_blank" class="btn btn-sm btn-outline-primary rounded-circle" style="width: 28px; height: 28px; padding: 0; line-height: 26px;" title="เปิดเอกสาร"><i class="fa-solid fa-file-pdf"></i></a>' : '<span class="text-muted small">-</span>';

    const photoUrl = (typeof formatStaffPhotoUrl === 'function' ? formatStaffPhotoUrl(r.photo_url) : r.photo_url) || (window.DEFAULT_STAFF_AVATAR || '');

    const tr = `
      <tr>
        <td class="text-center"><span class="badge bg-primary-subtle text-primary border rounded-pill px-2 py-0 fw-bold" style="font-size: 0.72rem;">#${pin}</span></td>
        <td>
          <div class="d-flex align-items-center gap-2">
            <img src="${photoUrl}" class="rounded-circle border" style="width: 32px; height: 32px; object-fit: cover;" onerror="this.onerror=null;if(window.DEFAULT_STAFF_AVATAR)this.src=window.DEFAULT_STAFF_AVATAR;">
            <div class="min-w-0">
              <a href="javascript:void(0)" class="fw-bold text-dark text-truncate d-block" onclick="openPersonnelInPaneDetail('${pin}')" style="font-size: 0.84rem;">${nameTh}</a>
              <div class="text-muted" style="font-size: 0.70rem;">${r.position_title || 'อาจารย์'} • ${r.department || ''}</div>
            </div>
          </div>
        </td>
        <td><span class="fw-bold text-dark">${r.academic_title || '-'}</span></td>
        <td class="text-secondary small">${r.academic_branch || '-'}</td>
        <td class="text-nowrap">${subDateStr}</td>
        <td class="text-center">${statusBadge}</td>
        <td>${appCell}</td>
        <td class="text-center">${docLink}</td>
        <td class="text-center text-nowrap">
          <div class="btn-group btn-group-sm">
            <button type="button" class="btn btn-outline-primary btn-sm" onclick="openPersonnelEditInPane('${pin}', '#editpane-tab-academic-track')" title="เปิดดูประวัติและแก้ไขคำขอของท่านนี้">
              <i class="fa-solid fa-arrow-up-right-from-square me-1"></i>จัดการ
            </button>
          </div>
        </td>
      </tr>
    `;
    $tbody.append(tr);
  });
}
</script>
